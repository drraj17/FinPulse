                        </div>
                        <div class="tx-grid-list scrollable">
                            ${incomeTxs.length > 0
                                ? incomeTxs.map(renderFullViewTxCard).join('')
                                : `<p style="font-size:13.5px;color:var(--text-muted);text-align:center;padding:18px;">No income recorded for ${escHtml(ymTitle)}.</p>`
                            }
                        </div>
                    </div>
                `;
            }

            // Monthly Savings
            return `
                <div class="inline-expanded-body">
                    <div class="expanded-header">
                        <div class="expanded-header-left">
                            <span class="meta-pill">${escHtml(ymTitle)}</span>
                            <span class="meta-pill">${monthTxs.length} total entries</span>
                        </div>
                        <div class="expanded-header-right">${collapseBtn}</div>
                    </div>
                    <div class="savings-summary-grid">
                        <div class="summary-stat-tile">
                            <span class="summary-stat-label">Income</span>
                            <span class="summary-stat-val tabular-nums text-income">+${formatINR(totalInc)}</span>
                        </div>
                        <div class="summary-stat-tile">
                            <span class="summary-stat-label">Expenses</span>
                            <span class="summary-stat-val tabular-nums text-expense">-${formatINR(totalExp)}</span>
                        </div>
                        <div class="summary-stat-tile">
                            <span class="summary-stat-label">Net Saved</span>
                            <span class="summary-stat-val tabular-nums ${savings >= 0 ? 'text-cyan' : 'text-expense'}">${formatINR(savings)}</span>
                        </div>
                        <div class="summary-stat-tile">
                            <span class="summary-stat-label">Savings Rate</span>
                            <span class="summary-stat-val tabular-nums text-accent">${savingsPct}%</span>
                        </div>
                    </div>
                    <div class="tx-grid-list scrollable">
                        ${monthTxs.length > 0
                            ? monthTxs.map(renderFullViewTxCard).join('')
                            : `<p style="font-size:13.5px;color:var(--text-muted);text-align:center;padding:18px;">No transactions recorded for ${escHtml(ymTitle)}.</p>`
                        }
                    </div>
                </div>
            `;
        }

        function renderOverview() {
            const activeYM = getActiveMonthKey();
            const ymTitle = formatMonthYear(activeYM);
            const monthTxs = sortTransactionsDesc(
                state.data.transactions.filter(t => (t.date || '').startsWith(activeYM))
            );
            const expenseTxs = monthTxs.filter(t => t.type === 'expense');
            const incomeTxs = monthTxs.filter(t => t.type === 'income');

            const totalExp = expenseTxs.reduce((s, t) => s + (Number(t.amount) || 0), 0);
            const totalInc = incomeTxs.reduce((s, t) => s + (Number(t.amount) || 0), 0);

            const expCats = state.data.categories.filter(c => c.type === 'expense');
            const totalBudget = expCats.reduce((s, c) => s + (Number(c.limit) || 0), 0);
            const rawPct = totalBudget > 0 ? Math.round((totalExp / totalBudget) * 100) : 0;
            const barPct = Math.min(100, Math.max(0, rawPct));

            let budgetFillClass = 'bg-emerald';
            let budgetValClass = 'text-accent';
            if (rawPct > 100) {
                budgetFillClass = 'bg-rose';
                budgetValClass = 'text-expense';
            } else if (rawPct >= 75) {
                budgetFillClass = 'bg-amber';
                budgetValClass = 'text-amber';
            }

            const savings = totalInc - totalExp;
            const savingsPct = totalInc > 0 ? Math.round((savings / totalInc) * 100) : 0;

            // Exact Required Single-Column Order:
            // 1. Monthly Expenses -> 2. Monthly Budget -> 3. Monthly Income -> 4. Monthly Savings
            const kpis = [
                {
                    key: 'expense',
                    label: 'Monthly Expenses',
                    value: formatINR(totalExp),
                    valClass: 'text-expense',
                    sub: `${expenseTxs.length} ${expenseTxs.length === 1 ? 'entry' : 'entries'} • ${ymTitle}`,
                    iconBg: 'var(--expense-soft)',
                    iconColor: 'var(--expense)',
                    iconSvg: '<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline>',
                    extraHtml: ''
                },
                {
                    key: 'budget',
                    label: 'Monthly Budget',
                    value: formatINR(totalBudget),
                    valClass: budgetValClass,
                    sub: `${formatINR(totalExp)} spent • ${rawPct}% used`,
                    iconBg: 'var(--amber-soft)',
                    iconColor: 'var(--amber)',
                    iconSvg: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path>',
                    extraHtml: `
                        <div class="kpi-budget-bar-wrap">
                            <div class="progress-track" style="flex:1;">
                                <div class="progress-fill ${budgetFillClass}" style="width:${barPct}%;"></div>
                            </div>
                            <span class="tabular-nums" style="font-size:12px;font-weight:700;color:var(--text-secondary);white-space:nowrap;">${rawPct}%</span>
                        </div>
                    `
                },
                {
                    key: 'income',
                    label: 'Monthly Income',
                    value: formatINR(totalInc),
                    valClass: 'text-income',
                    sub: `${incomeTxs.length} ${incomeTxs.length === 1 ? 'credit' : 'credits'} • ${ymTitle}`,
                    iconBg: 'var(--income-soft)',
                    iconColor: 'var(--income)',
                    iconSvg: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline>',
                    extraHtml: ''
                },
                {
                    key: 'savings',
                    label: 'Monthly Savings',
                    value: formatINR(savings),
                    valClass: savings >= 0 ? 'text-cyan' : 'text-expense',
                    sub: `${savingsPct}% savings rate • ${ymTitle}`,
                    iconBg: 'var(--cyan-soft)',
                    iconColor: 'var(--cyan)',
                    iconSvg: '<path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><circle cx="16" cy="11" r="1"/>',
                    extraHtml: ''
                }
            ];

            const kpisHtml = kpis.map(k => {
                const isOpen = state.expandedOverviewKpi === k.key;
                return `
                    <div class="card kpi-card ${isOpen ? 'active-card' : ''}">
                        <button type="button" class="kpi-card-header" data-action="toggle-kpi" data-kpi="${k.key}" aria-expanded="${isOpen ? 'true' : 'false'}">
                            <div class="kpi-main-row">
                                <div class="kpi-left">
                                    <div class="kpi-icon-box" style="background:${k.iconBg};color:${k.iconColor};">
                                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${k.iconSvg}</svg>
                                    </div>
                                    <div class="kpi-text-col">
                                        <span class="kpi-label">${k.label}</span>
                                        <span class="kpi-sub-text">${escHtml(k.sub)}</span>
                                    </div>
                                </div>
                                <div class="kpi-right">
                                    <div class="kpi-value tabular-nums ${k.valClass}">${k.value}</div>
                                    <div class="chevron-box ${isOpen ? 'rotated' : ''}">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </div>
                                </div>
                            </div>
                            ${k.extraHtml}
                        </button>
                        ${isOpen ? renderOverviewKpiInlineBody(
                            k.key, ymTitle, expenseTxs, incomeTxs, monthTxs, expCats, totalExp, totalInc, totalBudget, savings, savingsPct
                        ) : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="stack-lg">
                    <!-- Top 4 KPI Boards Arranged One Below One -->
                    <section aria-label="Monthly Overview Metrics" class="kpi-stack">
                        ${kpisHtml}
                    </section>

                    <!-- Cash Flow Trend & Spending by Category -->
                    <section class="charts-grid" aria-label="Analytics Charts">
                        <div class="card chart-card">
                            <div class="chart-header">
                                <div>
                                    <h2 class="chart-title">Cash Flow Trend</h2>
                                    <p class="chart-subtitle">
                                        ${state.trendGranularity === 'day'
                                            ? 'Daily Income vs Expense'
                                            : state.trendGranularity === 'month'
                                                ? 'Monthly Income vs Expense'
                                                : 'Yearly Income vs Expense'}
                                    </p>
                                </div>
                                <div class="controls-cluster">
                                    <div class="segmented-group" role="group" aria-label="Timeframe">
                                        <button type="button" class="seg-btn ${state.trendGranularity === 'day' ? 'active' : ''}" data-action="set-trend-granularity" data-val="day">Day</button>
                                        <button type="button" class="seg-btn ${state.trendGranularity === 'month' ? 'active' : ''}" data-action="set-trend-granularity" data-val="month">Month</button>
                                        <button type="button" class="seg-btn ${state.trendGranularity === 'year' ? 'active' : ''}" data-action="set-trend-granularity" data-val="year">Year</button>
                                    </div>

                                    <button type="button" class="series-pill ${state.showTrendIncome ? 'active-inc' : 'muted'}" data-action="toggle-trend-series" data-series="income">
                                        <span class="dot-indicator" style="background:${state.showTrendIncome ? 'var(--income-solid)' : 'var(--text-muted)'};"></span>
                                        <span>Income</span>
                                    </button>
                                    <button type="button" class="series-pill ${state.showTrendExpense ? 'active-exp' : 'muted'}" data-action="toggle-trend-series" data-series="expense">
                                        <span class="dot-indicator" style="background:${state.showTrendExpense ? 'var(--expense-solid)' : 'var(--text-muted)'};"></span>
                                        <span>Expense</span>
                                    </button>

                                    <div class="segmented-group" role="group" aria-label="Chart Style">
                                        <button type="button" class="seg-btn ${state.trendStyle === 'area' ? 'active-surface' : ''}" data-action="set-trend-style" data-val="area">Area</button>
                                        <button type="button" class="seg-btn ${state.trendStyle === 'bar' ? 'active-surface' : ''}" data-action="set-trend-style" data-val="bar">Bar</button>
                                    </div>
                                </div>
                            </div>
                            <div id="trend-chart-host" class="trend-host"></div>
                        </div>

                        <div class="card chart-card">
                            <div style="margin-bottom:14px;">
                                <h2 class="chart-title">Spending by Category</h2>
                                <p class="chart-subtitle">${escHtml(ymTitle)} Expense Breakdown</p>
                            </div>
                            ${renderDonutSection(expenseTxs, totalExp)}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderTrendChartSVG() {
            const host = $('trend-chart-host');
            if (!host) return;

            if (!state.showTrendIncome && !state.showTrendExpense) {
                host.innerHTML = `
                    <div style="height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--border-strong);border-radius:14px;padding:18px;">
                        <p style="font-size:14px;font-weight:700;color:var(--text-secondary);">Both series are hidden</p>
                        <p style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">Toggle Income or Expense pills above to view cash flow.</p>
                    </div>
                `;
                return;
            }

            const gran = state.trendGranularity;
            const map = {};
            for (const tx of state.data.transactions) {
                if (!tx.date || tx.date.length < 4) continue;
                let key = '';
                if (gran === 'day') {
                    if (tx.date.length < 10) continue;
                    key = tx.date.slice(0, 10);
                } else if (gran === 'month') {
                    if (tx.date.length < 7) continue;
                    key = tx.date.slice(0, 7);
                } else {
                    key = tx.date.slice(0, 4);
                }
                if (!map[key]) map[key] = { key, income: 0, expense: 0 };
                const amt = Number(tx.amount) || 0;
                if (tx.type === 'income') map[key].income += amt;
                else map[key].expense += amt;
            }

            let points = Object.values(map).sort((a, b) => a.key.localeCompare(b.key));
            if (gran === 'day') points = points.slice(-14);
            else if (gran === 'month') points = points.slice(-12);

            if (points.length === 0) {
                const now = new Date();
                points = [{ key: toISODate(now.getFullYear(), now.getMonth(), now.getDate()), income: 0, expense: 0 }];
            }

            const formatX = (k) => {
                if (gran === 'day') return formatDayMonth(k);
                if (gran === 'month') return formatMonthYearShort(k);
                return k;
            };
            const formatPeriodTT = (k) => {
                if (gran === 'day') return formatFullDate(k);
                if (gran === 'month') return formatMonthYear(k);
                return `Year ${k}`;
            };

            let maxVal = 0;
            for (const p of points) {
                if (state.showTrendIncome && p.income > maxVal) maxVal = p.income;
                if (state.showTrendExpense && p.expense > maxVal) maxVal = p.expense;
            }
            if (maxVal <= 0) maxVal = 10000;
            const unit = maxVal >= 500000 ? 100000 : (maxVal >= 50000 ? 10000 : (maxVal >= 10000 ? 5000 : 1000));
            const maxY = Math.ceil((maxVal * 1.15) / unit) * unit;

            const measuredW = host.clientWidth || host.getBoundingClientRect().width || 0;
            const W = Math.max(Math.floor(measuredW), 320);
            const H = 280;
            const padL = 58;
            const padR = 16;
            const padT = 18;
            const padB = 34;
            const plotW = Math.max(120, W - padL - padR);
            const plotH = H - padT - padB;

            const isLight = document.documentElement.classList.contains('light');
            const axisText = isLight ? '#334155' : '#cbd5e1';
            const gridStroke = isLight ? 'rgba(15,23,42,0.09)' : 'rgba(148,163,184,0.16)';
            const dotBorder = isLight ? '#ffffff' : '#111827';

            const getX = (i) => points.length === 1 ? padL + plotW / 2 : padL + (i / (points.length - 1)) * plotW;
            const getY = (v) => padT + plotH - (v / maxY) * plotH;

            let gridLines = '';
            for (let i = 0; i <= 4; i++) {
                const v = (maxY / 4) * i;
                const y = Math.round(getY(v));
                gridLines += `
                    <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${gridStroke}" stroke-width="1" ${i === 0 ? '' : 'stroke-dasharray="4 4"'} />
                    <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="12" font-weight="600" fill="${axisText}">${formatAxisINR(v)}</text>
                `;
            }

            const maxLabels = Math.max(3, Math.floor(plotW / 66));
            const step = Math.max(1, Math.ceil(points.length / maxLabels));
            let xLabels = '';
            points.forEach((p, idx) => {
                if (idx % step === 0 || idx === points.length - 1) {
                    const x = Math.round(getX(idx));
                    xLabels += `<text x="${x}" y="${H - 10}" text-anchor="middle" font-size="12" font-weight="600" fill="${axisText}">${escHtml(formatX(p.key))}</text>`;
                }
            });

            let shapes = '';
            if (state.trendStyle === 'area') {
                if (state.showTrendIncome) {
                    const pts = points.map((p, i) => `${getX(i).toFixed(1)},${getY(p.income).toFixed(1)}`);
                    const line = `M ${pts.join(' L ')}`;
                    const area = points.length > 1 ? `${line} L ${getX(points.length - 1).toFixed(1)},${padT + plotH} L ${getX(0).toFixed(1)},${padT + plotH} Z` : '';
                    shapes += `
                        <defs>
                            <linearGradient id="fpIncGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
                                <stop offset="100%" stop-color="#10b981" stop-opacity="0.01"/>
                            </linearGradient>
                        </defs>
                        ${area ? `<path d="${area}" fill="url(#fpIncGrad)"/>` : ''}
                        ${points.length > 1 ? `<path d="${line}" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
                    `;
                    points.forEach((p, i) => {
                        shapes += `<circle cx="${getX(i).toFixed(1)}" cy="${getY(p.income).toFixed(1)}" r="4" fill="#10b981" stroke="${dotBorder}" stroke-width="2"/>`;
                    });
                }
                if (state.showTrendExpense) {
                    const pts = points.map((p, i) => `${getX(i).toFixed(1)},${getY(p.expense).toFixed(1)}`);
                    const line = `M ${pts.join(' L ')}`;
                    const area = points.length > 1 ? `${line} L ${getX(points.length - 1).toFixed(1)},${padT + plotH} L ${getX(0).toFixed(1)},${padT + plotH} Z` : '';
                    shapes += `
                        <defs>
                            <linearGradient id="fpExpGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#fb7185" stop-opacity="0.28"/>
                                <stop offset="100%" stop-color="#fb7185" stop-opacity="0.01"/>
                            </linearGradient>
                        </defs>
                        ${area ? `<path d="${area}" fill="url(#fpExpGrad)"/>` : ''}
                        ${points.length > 1 ? `<path d="${line}" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
                    `;
                    points.forEach((p, i) => {
                        shapes += `<circle cx="${getX(i).toFixed(1)}" cy="${getY(p.expense).toFixed(1)}" r="4" fill="#fb7185" stroke="${dotBorder}" stroke-width="2"/>`;
                    });
                }
            } else {
                const slotW = plotW / points.length;
                const barW = Math.min(22, Math.max(7, slotW * 0.34));
                const both = state.showTrendIncome && state.showTrendExpense;
                points.forEach((p, i) => {
                    const cx = getX(i);
                    if (state.showTrendIncome) {
                        const x = both ? cx - barW - 2 : cx - barW / 2;
                        const y = getY(p.income);
                        const h = Math.max(2, padT + plotH - y);
                        shapes += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="#10b981"/>`;
                    }
                    if (state.showTrendExpense) {
                        const x = both ? cx + 2 : cx - barW / 2;
                        const y = getY(p.expense);
                        const h = Math.max(2, padT + plotH - y);
                        shapes += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="#fb7185"/>`;
                    }
                });
            }

            const sliceW = plotW / points.length;
            const hitZones = points.map((p, i) => {
                const cx = getX(i);
                const net = p.income - p.expense;
                return `
                    <rect
                        class="fp-hit"
                        x="${Math.max(padL, cx - sliceW / 2).toFixed(1)}"
                        y="${padT}"
                        width="${sliceW.toFixed(1)}"
                        height="${plotH}"
                        fill="transparent"
                        style="cursor:crosshair;"
                        data-period="${escHtml(formatPeriodTT(p.key))}"
                        data-inc="${escHtml(formatINR(p.income))}"
                        data-exp="${escHtml(formatINR(p.expense))}"
                        data-net="${escHtml(formatINR(net, true))}"
                        data-pos="${net >= 0 ? '1' : '0'}"
                        data-cx="${cx.toFixed(1)}"
                    />
                `;
            }).join('');

            host.innerHTML = `
                <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;user-select:none;">
                    ${gridLines}
                    ${xLabels}
                    ${shapes}
                    <line id="fp-guide" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3" opacity="0"/>
                    ${hitZones}
                </svg>
                <div id="fp-tooltip" class="trend-tooltip hidden">
                    <div id="fp-tt-period" style="font-weight:700;color:var(--text-muted);padding-bottom:6px;border-bottom:1px solid var(--border);"></div>
                    <div class="tt-row"><span class="text-income" style="font-weight:600;">Income:</span><strong id="fp-tt-inc" class="tabular-nums"></strong></div>
                    <div class="tt-row"><span class="text-expense" style="font-weight:600;">Expense:</span><strong id="fp-tt-exp" class="tabular-nums"></strong></div>
                    <div class="tt-row" style="padding-top:6px;border-top:1px solid var(--border);"><span style="font-weight:700;">Net:</span><strong id="fp-tt-net" class="tabular-nums"></strong></div>
                </div>
            `;

            const tt = $('fp-tooltip');
            const guide = $('fp-guide');
            const ttPeriod = $('fp-tt-period');
            const ttInc = $('fp-tt-inc');
            const ttExp = $('fp-tt-exp');
            const ttNet = $('fp-tt-net');

            host.querySelectorAll('.fp-hit').forEach(el => {
                const showTT = () => {
                    if (ttPeriod) ttPeriod.textContent = el.getAttribute('data-period') || '';
                    if (ttInc) ttInc.textContent = el.getAttribute('data-inc') || '₹0';
                    if (ttExp) ttExp.textContent = el.getAttribute('data-exp') || '₹0';
                    if (ttNet) {
                        ttNet.textContent = el.getAttribute('data-net') || '₹0';
                        ttNet.className = `tabular-nums ${el.getAttribute('data-pos') === '1' ? 'text-income' : 'text-expense'}`;
                    }
                    if (guide) {
                        const cx = el.getAttribute('data-cx');
                        guide.setAttribute('x1', cx);
                        guide.setAttribute('x2', cx);
                        guide.setAttribute('opacity', '1');
                    }
                    if (tt) tt.classList.remove('hidden');
                };
                el.addEventListener('mouseenter', showTT);
                el.addEventListener('touchstart', showTT, { passive: true });
            });

            host.onmouseleave = () => {
                if (tt) tt.classList.add('hidden');
                if (guide) guide.setAttribute('opacity', '0');
            };

            if (typeof ResizeObserver !== 'undefined') {
                if (trendResizeObserver) trendResizeObserver.disconnect();
                let lastW = W;
                trendResizeObserver = new ResizeObserver(entries => {
                    for (const entry of entries) {
                        const newW = Math.floor(entry.contentRect.width);
                        if (newW >= 260 && Math.abs(newW - lastW) > 8) {
                            lastW = newW;
                            renderTrendChartSVG();
                        }
                    }
                });
                trendResizeObserver.observe(host);
            }
        }

        function renderDonutSection(expenseTxs, totalExp) {
            if (expenseTxs.length === 0 || totalExp <= 0) {
                return `
                    <div style="height:230px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--border-strong);border-radius:14px;padding:18px;">
                        <p style="font-size:13.5px;color:var(--text-muted);">No expenses recorded for this month.</p>
                    </div>
                `;
            }

            const map = {};
            for (const tx of expenseTxs) {
                if (!map[tx.categoryId]) map[tx.categoryId] = { catId: tx.categoryId, total: 0, txs: [] };
                map[tx.categoryId].total += Number(tx.amount) || 0;
                map[tx.categoryId].txs.push(tx);
            }

            const slices = Object.values(map)
                .map(s => ({
                    catId: s.catId,
                    total: s.total,
                    txs: s.txs,
                    cat: getCategory(s.catId),
                    pct: Math.round((s.total / totalExp) * 100)
                }))
                .sort((a, b) => b.total - a.total);

            const r = 76;
            const circ = 2 * Math.PI * r;
            let offset = 0;

            const circles = slices.map(s => {
                const len = (s.total / totalExp) * circ;
                const dashOffset = -offset;
                offset += len;
                const active = state.expandedOverviewCatId === s.catId;
                return `
                    <circle
                        class="donut-slice"
                        data-action="toggle-overview-cat"
                        data-cat-id="${escHtml(s.catId)}"
                        cx="102"
                        cy="102"
                        r="${r}"
                        fill="transparent"
                        stroke="${s.cat.color}"
                        stroke-width="${active ? 25 : 20}"
                        stroke-dasharray="${Math.max(0, len - 2)} ${circ}"
                        stroke-dashoffset="${dashOffset}"
                        transform="rotate(-90 102 102)"
                    />
                `;
            }).join('');

            const rows = slices.map(s => {
                const isOpen = state.expandedOverviewCatId === s.catId;
                return `
                    <div class="cat-breakdown-item ${isOpen ? 'active' : ''}">
                        <button type="button" class="cat-breakdown-btn" data-action="toggle-overview-cat" data-cat-id="${escHtml(s.catId)}">
                            <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">
                                <span style="width:10px;height:10px;border-radius:50%;background:${s.cat.color};flex-shrink:0;"></span>
                                <span style="font-size:13.5px;font-weight:700;color:var(--text-primary);word-break:break-word;">${escHtml(s.cat.name)}</span>
                                <span class="meta-pill">${s.pct}%</span>
                            </div>
                            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                                <span class="tabular-nums text-expense" style="font-size:14px;font-weight:700;">-${formatINR(s.total)}</span>
                                <div class="chevron-box ${isOpen ? 'rotated' : ''}">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </div>
                            </div>
                        </button>
                        ${isOpen ? `
                            <div class="inline-expanded-body">
                                <div class="tx-grid-list scrollable">
                                    ${s.txs.map(renderFullViewTxCard).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div>
                    <div class="donut-wrap">
                        <svg width="204" height="204" viewBox="0 0 204 204">
                            <circle cx="102" cy="102" r="${r}" fill="transparent" stroke="var(--border)" stroke-width="20"/>
                            ${circles}
                        </svg>
                        <div class="donut-center">
                            <span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);">Total Spend</span>
                            <span class="tabular-nums" style="font-size:1.06rem;font-weight:800;color:var(--text-primary);margin-top:3px;">${formatINR(totalExp)}</span>
                        </div>
                    </div>
                    <div class="cat-breakdown-list">${rows}</div>
                </div>
            `;
        }

        // ---------------------------------------------------------------------
        // 10. TAB 2: HISTORY (ONLY HISTORY — FILTERS + TRANSACTIONS / BY CATEGORY)
        // ---------------------------------------------------------------------
        function renderHistory() {
            const filtered = getFilteredTransactions();
            const activeCount = countActiveFilters();

            const years = Array.from(new Set(
                state.data.transactions.map(t => (t.date || '').slice(0, 4)).filter(y => y.length === 4)
            )).sort((a, b) => b.localeCompare(a));

            let bodyHtml = '';
            if (state.historyView === 'transactions') {
                if (filtered.length === 0) {
                    bodyHtml = `
                        <div class="card" style="padding:36px 20px;text-align:center;">
                            <h3 style="font-size:1rem;font-weight:700;color:var(--text-secondary);">No matching transactions</h3>
                            ${activeCount > 0 ? `<button type="button" class="btn btn-primary" style="margin-top:14px;" data-action="reset-filters">Reset Filters</button>` : ''}
                        </div>
                    `;
                } else {
                    const dateGroups = [];
                    const dateMap = {};
                    for (const tx of filtered) {
                        const dKey = tx.date || 'Unknown';
                        if (!dateMap[dKey]) {
                            dateMap[dKey] = { date: dKey, net: 0, txs: [] };
                            dateGroups.push(dateMap[dKey]);
                        }
                        const amt = Number(tx.amount) || 0;
                        dateMap[dKey].net += tx.type === 'income' ? amt : -amt;
                        dateMap[dKey].txs.push(tx);
                    }

                    bodyHtml = `
                        <div class="stack-lg">
                            ${dateGroups.map(grp => `
                                <section class="date-group-section">
                                    <div class="date-group-header">
                                        <span class="date-group-label">${escHtml(formatDateGroupHeader(grp.date))}</span>
                                        <span class="date-group-net tabular-nums ${grp.net >= 0 ? 'text-income' : 'text-expense'}">
                                            ${formatINR(grp.net, true)}
                                        </span>
                                    </div>
                                    <div class="tx-grid-list history-columns">
                                        ${grp.txs.map(renderFullViewTxCard).join('')}
                                    </div>
                                </section>
                            `).join('')}
                        </div>
                    `;
                }
            } else {
                const groups = {};
                for (const tx of filtered) {
                    if (!groups[tx.categoryId]) {
                        groups[tx.categoryId] = { catId: tx.categoryId, expTotal: 0, incTotal: 0, txs: [] };
                    }
                    const amt = Number(tx.amount) || 0;
                    if (tx.type === 'income') groups[tx.categoryId].incTotal += amt;
                    else groups[tx.categoryId].expTotal += amt;
                    groups[tx.categoryId].txs.push(tx);
                }

                const list = Object.values(groups)
                    .filter(g => g.txs.length > 0)
                    .map(g => ({
                        catId: g.catId,
                        expTotal: g.expTotal,
                        incTotal: g.incTotal,
                        txs: g.txs,
                        cat: getCategory(g.catId)
                    }))
                    .sort((a, b) => (b.expTotal + b.incTotal) - (a.expTotal + a.incTotal));

                bodyHtml = `
                    <div class="history-cat-grid">
                        ${list.map(g => {
                            const isOpen = !!state.expandedHistoryCats[g.catId];
                            let sumHtml = '';
                            if (g.expTotal > 0 && g.incTotal > 0) {
                                sumHtml = `
                                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
                                        <span class="text-expense tabular-nums" style="font-size:14.5px;font-weight:800;">-${formatINR(g.expTotal)}</span>
                                        <span class="text-income tabular-nums" style="font-size:14.5px;font-weight:800;">+${formatINR(g.incTotal)}</span>
                                    </div>
                                `;
                            } else if (g.incTotal > 0) {
                                sumHtml = `<span class="text-income tabular-nums" style="font-size:15.5px;font-weight:800;">+${formatINR(g.incTotal)}</span>`;
                            } else {
                                sumHtml = `<span class="text-expense tabular-nums" style="font-size:15.5px;font-weight:800;">-${formatINR(g.expTotal)}</span>`;
                            }

                            return `
                                <div class="card ${isOpen ? 'active-card is-expanded' : ''}">
                                    <button type="button" class="cat-card-header-btn" data-action="toggle-history-cat" data-cat-id="${escHtml(g.catId)}">
                                        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
                                            <div class="tx-full-icon" style="background:${g.cat.color}22;color:${g.cat.color};">
                                                ${svgIcon(g.cat.icon, 21)}
                                            </div>
                                            <div style="display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;">
                                                <h3 style="font-size:15px;font-weight:700;color:var(--text-primary);word-break:break-word;">${escHtml(g.cat.name)}</h3>
                                                <span class="meta-pill">${g.txs.length}</span>
                                            </div>
                                        </div>
                                        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
                                            ${sumHtml}
                                            <div class="chevron-box ${isOpen ? 'rotated' : ''}">
                                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                            </div>
                                        </div>
                                    </button>
                                    ${isOpen ? `
                                        <div class="inline-expanded-body">
                                            <div class="tx-grid-list scrollable">
                                                ${g.txs.map(renderFullViewTxCard).join('')}
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            return `
                <div class="stack-md">
                    <div class="card toolbar-card">
                        <div class="toolbar-group">
                            <div class="segmented-group">
                                <button type="button" class="seg-btn ${state.historyView === 'transactions' ? 'active-surface' : ''}" data-action="set-history-view" data-view="transactions">Transactions</button>
                                <button type="button" class="seg-btn ${state.historyView === 'category' ? 'active-surface' : ''}" data-action="set-history-view" data-view="category">By Category</button>
                            </div>
                        </div>

                        <div class="toolbar-group">
                            <button type="button" class="btn ${state.filtersOpen || activeCount > 0 ? 'btn-primary' : 'btn-secondary'}" data-action="toggle-filters">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                                <span>Filters</span>
                                ${activeCount > 0 ? `<span style="background:#fff;color:#4f46e5;padding:1px 6px;border-radius:999px;font-size:11px;font-weight:800;">${activeCount}</span>` : ''}
                            </button>

                            ${activeCount > 0 ? `
                                <button type="button" class="btn btn-danger-soft" data-action="reset-filters" title="Reset all active filters">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                                    <span>Reset</span>
                                </button>
                            ` : ''}

                            <button type="button" class="btn btn-secondary" data-action="export-csv">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                <span>Export CSV</span>
                            </button>
                        </div>
                    </div>

                    ${state.filtersOpen ? `
                        <div class="card filter-panel">
                            <div>
                                <label class="field-label" for="f-search">Search Title / Note</label>
                                <input type="text" id="f-search" class="input-control" value="${escHtml(state.filters.search)}" placeholder="Search merchant or note...">
                            </div>
                            <div>
                                <label class="field-label" for="f-year">Year</label>
                                <select id="f-year" class="input-control">
                                    <option value="all" ${state.filters.year === 'all' ? 'selected' : ''}>All Years</option>
                                    ${years.map(y => `<option value="${y}" ${state.filters.year === y ? 'selected' : ''}>${y}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="field-label" for="f-month">Month</label>
                                <select id="f-month" class="input-control">
                                    <option value="all" ${state.filters.month === 'all' ? 'selected' : ''}>All Months</option>
                                    ${MONTH_NAMES.map((m, idx) => {
                                        const val = String(idx + 1).padStart(2, '0');
                                        return `<option value="${val}" ${state.filters.month === val ? 'selected' : ''}>${m}</option>`;
                                    }).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="field-label" for="f-type">Type</label>
                                <select id="f-type" class="input-control">
                                    <option value="all" ${state.filters.type === 'all' ? 'selected' : ''}>All Types</option>
                                    <option value="expense" ${state.filters.type === 'expense' ? 'selected' : ''}>Expense</option>
                                    <option value="income" ${state.filters.type === 'income' ? 'selected' : ''}>Income</option>
                                </select>
                            </div>
                            <div>
                                <label class="field-label" for="f-cat">Category</label>
                                <select id="f-cat" class="input-control">
                                    <option value="all" ${state.filters.categoryId === 'all' ? 'selected' : ''}>All Categories</option>
                                    ${state.data.categories.map(c => `<option value="${escHtml(c.id)}" ${state.filters.categoryId === c.id ? 'selected' : ''}>${escHtml(c.name)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="field-label" for="f-acc">Account</label>
                                <select id="f-acc" class="input-control">
                                    <option value="all" ${state.filters.accountId === 'all' ? 'selected' : ''}>All Accounts</option>
                                    ${state.data.accounts.map(a => `<option value="${escHtml(a.id)}" ${state.filters.accountId === a.id ? 'selected' : ''}>${escHtml(a.name)}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                    ` : ''}

                    ${bodyHtml}
                </div>
            `;
        }

        // ---------------------------------------------------------------------
        // 11. TAB 3: BUDGET (ONLY BUDGET — OVERALL BANNER + INLINE LIMIT CARDS)
        // ---------------------------------------------------------------------
        function renderBudget() {
            const activeYM = getActiveMonthKey();
            const ymTitle = formatMonthYear(activeYM);
            const monthExps = state.data.transactions.filter(
                t => t.type === 'expense' && (t.date || '').startsWith(activeYM)
            );

            const expCats = state.data.categories.filter(c => c.type === 'expense');
            const totalLimit = expCats.reduce((s, c) => s + (Number(c.limit) || 0), 0);
            const totalSpent = monthExps.reduce((s, t) => s + (Number(t.amount) || 0), 0);
            const rem = totalLimit - totalSpent;
            const overallPct = totalLimit > 0 ? Math.round((totalSpent / totalLimit) * 100) : 0;
            const barW = Math.min(100, Math.max(0, overallPct));

            let overallFill = 'bg-emerald';
            if (overallPct > 100) overallFill = 'bg-rose';
            else if (overallPct >= 75) overallFill = 'bg-amber';

            const cards = expCats.map(cat => {
                const spent = monthExps.filter(t => t.categoryId === cat.id).reduce((s, t) => s + (Number(t.amount) || 0), 0);
                const limit = Number(cat.limit) || 0;
                const diff = limit - spent;
                const pct = limit > 0 ? Math.round((spent / limit) * 100) : (spent > 0 ? 100 : 0);
                const w = Math.min(100, Math.max(0, pct));

                let fill = 'bg-emerald';
                let statusPill = `<span class="meta-pill tabular-nums" style="background:var(--income-soft);color:var(--income);border-color:transparent;">${formatINR(diff)} left</span>`;
                if (limit === 0 && spent === 0) {
                    statusPill = `<span class="meta-pill">No cap</span>`;
                } else if (pct > 100 || (limit === 0 && spent > 0)) {
                    fill = 'bg-rose';
                    statusPill = `<span class="meta-pill tabular-nums" style="background:var(--expense-soft);color:var(--expense);border-color:transparent;">${formatINR(Math.abs(diff))} over</span>`;
                } else if (pct >= 75) {
                    fill = 'bg-amber';
                    statusPill = `<span class="meta-pill tabular-nums" style="background:var(--amber-soft);color:var(--amber);border-color:transparent;">${formatINR(diff)} left</span>`;
                }

                const isEditing = state.editingBudgetId === cat.id;

                return `
                    <div class="card" style="padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;">
                        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0;">
                            <div style="display:flex;align-items:center;gap:12px;min-width:0;flex:1;">
                                <div class="tx-full-icon" style="background:${cat.color}22;color:${cat.color};">
                                    ${svgIcon(cat.icon, 21)}
                                </div>
                                <div style="min-width:0;flex:1;">
                                    <h3 style="font-size:15px;font-weight:700;word-break:break-word;">${escHtml(cat.name)}</h3>
                                    <p style="font-size:12px;color:var(--text-muted);margin-top:2px;">${pct}% utilized</p>
                                </div>
                            </div>
                            ${statusPill}
                        </div>

                        <div>
                            <div class="tabular-nums" style="display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:8px;">
                                <span><strong>${formatINR(spent)}</strong> <span style="color:var(--text-muted);font-size:12px;">spent</span></span>
                                <span style="color:var(--text-muted);font-size:12px;font-weight:700;">Cap: ${formatINR(limit)}</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill ${fill}" style="width:${w}%;"></div>
                            </div>
                        </div>

                        ${isEditing ? `
                            <form data-budget-form="${escHtml(cat.id)}" style="display:flex;align-items:center;gap:7px;padding-top:12px;border-top:1px solid var(--border-subtle);">
                                <input type="number" name="limit" class="input-control" min="0" step="100" value="${limit}" required style="min-height:38px;">
                                <button type="submit" class="btn btn-primary" style="min-height:38px;padding:6px 12px;">Save</button>
                                <button type="button" class="btn btn-secondary" style="min-height:38px;padding:6px 10px;" data-action="cancel-budget-edit">✕</button>
                            </form>
                        ` : `
                            <div style="padding-top:12px;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;">
                                <button type="button" class="btn btn-secondary" style="min-height:35px;padding:5px 12px;font-size:12px;" data-action="edit-budget" data-cat-id="${escHtml(cat.id)}">Edit Limit</button>
                            </div>
                        `}
                    </div>
                `;
            }).join('');

            return `
                <div class="stack-lg">
                    <div class="card" style="padding:20px;">
                        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;">
                            <div>
                                <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);">${escHtml(ymTitle)} Budget</span>
                                <h1 style="font-size:1.25rem;font-weight:800;margin-top:4px;">Monthly Spending Limits</h1>
                            </div>
                            <div class="tabular-nums" style="text-align:right;">
                                <div style="font-size:1.4rem;font-weight:800;">
                                    ${formatINR(totalSpent)} <span style="font-size:0.9rem;font-weight:600;color:var(--text-muted);">/ ${formatINR(totalLimit)}</span>
                                </div>
                                <p class="${rem >= 0 ? 'text-income' : 'text-expense'}" style="font-size:12.5px;font-weight:700;margin-top:3px;">
                                    ${rem >= 0 ? `${formatINR(rem)} remaining` : `${formatINR(Math.abs(rem))} over budget`}
                                </p>
                            </div>
                        </div>
                        <div class="progress-track" style="height:10px;margin-top:15px;">
                            <div class="progress-fill ${overallFill}" style="width:${barW}%;"></div>
                        </div>
                    </div>

                    <div class="budget-grid">${cards}</div>
                </div>
            `;
        }

        // ---------------------------------------------------------------------
        // 12. TAB 4: ACCOUNTS (NET WORTH HERO + EXPANDABLE ACCOUNT CARDS)
        // ---------------------------------------------------------------------
        function renderAccounts() {
            const accounts = state.data.accounts.map(acc => {
                const bal = getAccountBalance(acc.id);
                const txs = sortTransactionsDesc(state.data.transactions.filter(t => t.accountId === acc.id));
                return Object.assign({}, acc, { bal, txs });
            });

            let assets = 0;
            let dues = 0;
            for (const a of accounts) {
                if (a.bal >= 0) assets += a.bal;
                else dues += Math.abs(a.bal);
            }
            const netWorth = assets - dues;

            const cardsHtml = accounts.map(acc => {
                const isOpen = state.expandedAccountId === acc.id;
                return `
                    <div class="card ${isOpen ? 'active-card is-expanded' : ''}">
                        <div style="padding:18px;cursor:pointer;user-select:none;" data-action="toggle-account" data-acc-id="${escHtml(acc.id)}">
                            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0;">
                                <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
                                    <div class="tx-full-icon" style="background:${acc.color}22;color:${acc.color};">
                                        ${svgIcon(acc.icon, 21)}
                                    </div>
                                    <div style="min-width:0;flex:1;">
                                        <h3 style="font-size:15.5px;font-weight:700;word-break:break-word;">${escHtml(acc.name)}</h3>
                                        <span class="meta-pill" style="margin-top:4px;">${escHtml(acc.type)}</span>
                                    </div>
                                </div>
                                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                                    <button type="button" class="card-action-btn" data-action="edit-acc-shortcut" data-acc-id="${escHtml(acc.id)}" title="Edit Account" aria-label="Edit Account">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                    </button>
                                    <button type="button" class="card-action-btn del" data-action="delete-account" data-acc-id="${escHtml(acc.id)}" title="Delete Account" aria-label="Delete Account">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                    </button>
                                </div>
                            </div>

                            <div style="margin-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;">
                                <div style="min-width:0;">
                                    <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);">Current Balance</span>
                                    <div class="tabular-nums ${acc.bal < 0 ? 'text-expense' : ''}" style="font-size:1.42rem;font-weight:800;margin-top:2px;">
                                        ${formatINR(acc.bal)}
                                    </div>
                                </div>
                                <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                                    <span class="meta-pill">${acc.txs.length} ${acc.txs.length === 1 ? 'entry' : 'entries'}</span>
                                    <div class="chevron-box ${isOpen ? 'rotated' : ''}">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </div>

        // ---------------------------------------------------------------------
        // 14. MAIN RENDER ORCHESTRATOR
        // ---------------------------------------------------------------------
        function renderApp() {
            if (trendResizeObserver) {
                trendResizeObserver.disconnect();
                trendResizeObserver = null;
            }

            ['overview', 'history', 'budget', 'accounts'].forEach(t => {
                const navEl = $(`nav-${t}`);
                if (navEl) navEl.className = `nav-tab ${state.activeTab === t ? 'active' : ''}`;
            });

            const main = $('app-main');
            if (!main) return;

            if (state.activeTab === 'overview') {
                main.innerHTML = renderOverview();
                renderTrendChartSVG();
            } else if (state.activeTab === 'history') {
                main.innerHTML = renderHistory();
                bindHistoryFilterInputs();
            } else if (state.activeTab === 'budget') {
                main.innerHTML = renderBudget();
            } else if (state.activeTab === 'accounts') {
                main.innerHTML = renderAccounts();
            }
        }

        function bindHistoryFilterInputs() {
            const sEl = $('f-search');
            const yEl = $('f-year');
            const mEl = $('f-month');
            const tEl = $('f-type');
            const cEl = $('f-cat');
            const aEl = $('f-acc');

            if (sEl) {
                sEl.addEventListener('input', (e) => {
                    state.filters.search = e.target.value;
                    const pos = e.target.selectionStart;
                    renderApp();
                    const restored = $('f-search');
                    if (restored) {
                        restored.focus();
                        try { restored.setSelectionRange(pos, pos); } catch (err) {}
                    }
                });
            }
            if (yEl) yEl.addEventListener('change', (e) => { state.filters.year = e.target.value; renderApp(); });
            if (mEl) mEl.addEventListener('change', (e) => { state.filters.month = e.target.value; renderApp(); });
            if (tEl) tEl.addEventListener('change', (e) => { state.filters.type = e.target.value; renderApp(); });
            if (cEl) cEl.addEventListener('change', (e) => { state.filters.categoryId = e.target.value; renderApp(); });
            if (aEl) aEl.addEventListener('change', (e) => { state.filters.accountId = e.target.value; renderApp(); });
        }

        // ---------------------------------------------------------------------
        // 15. TRANSACTION MODAL & SMART TITLE AUTO-FILL
        // ---------------------------------------------------------------------
        function syncTxTypeButtons(type) {
            state.txType = type;
            const expBtn = $('tx-type-exp');
            const incBtn = $('tx-type-inc');
            if (expBtn) expBtn.className = `type-switch-btn ${type === 'expense' ? 'active-exp' : ''}`;
            if (incBtn) incBtn.className = `type-switch-btn ${type === 'income' ? 'active-inc' : ''}`;
        }

        function populateTxDropdowns(type, selCatId, selAccId) {
            const catSel = $('tx-category');
            const accSel = $('tx-account');
            if (!catSel || !accSel) return;

            const primary = state.data.categories.filter(c => c.type === type);
            const secondary = state.data.categories.filter(c => c.type !== type);
            catSel.innerHTML = primary.concat(secondary).map(c =>
                `<option value="${escHtml(c.id)}" ${c.id === selCatId ? 'selected' : ''}>${escHtml(c.name)}</option>`
            ).join('');

            accSel.innerHTML = state.data.accounts.map(a =>
                `<option value="${escHtml(a.id)}" ${a.id === selAccId ? 'selected' : ''}>${escHtml(a.name)}</option>`
            ).join('');
        }

        function openTxModal(txId) {
            const modal = $('modal-tx');
            const heading = $('tx-modal-heading');
            const idEl = $('tx-id');
            const titleEl = $('tx-title');
            const amtEl = $('tx-amount');
            const dateEl = $('tx-date');
            const noteEl = $('tx-note');
            const popup = $('tx-autofill-popup');
            if (!modal || !heading || !idEl || !titleEl || !amtEl || !dateEl || !noteEl) return;

            if (popup) popup.classList.add('hidden');

            if (txId) {
                const tx = state.data.transactions.find(t => t.id === txId);
                if (!tx) return;
                heading.textContent = 'Edit Transaction';
                idEl.value = tx.id;
                titleEl.value = tx.title;
                amtEl.value = tx.amount;
                dateEl.value = tx.date;
                noteEl.value = tx.note || '';
                syncTxTypeButtons(tx.type);
                populateTxDropdowns(tx.type, tx.categoryId, tx.accountId);
            } else {
                heading.textContent = 'Add Transaction';
                idEl.value = '';
                titleEl.value = '';
                amtEl.value = '';
                const d = new Date();
                dateEl.value = toISODate(d.getFullYear(), d.getMonth(), d.getDate());
                noteEl.value = '';
                syncTxTypeButtons('expense');
                const defCat = state.data.categories.find(c => c.type === 'expense') || state.data.categories[0];
                const defAcc = state.data.accounts[0];
                populateTxDropdowns('expense', defCat ? defCat.id : '', defAcc ? defAcc.id : '');
            }

            modal.classList.remove('hidden');
            setTimeout(() => { titleEl.focus(); }, 40);
        }

        function closeTxModal() {
            const modal = $('modal-tx');
            const popup = $('tx-autofill-popup');
            if (popup) popup.classList.add('hidden');
            if (modal) modal.classList.add('hidden');
        }

        function renderAutofillDropdown(query) {
            const popup = $('tx-autofill-popup');
            if (!popup) return;
            const q = String(query || '').trim().toLowerCase();
            if (!q) {
                popup.classList.add('hidden');
                return;
            }

            const seen = new Set();
            const hits = [];
            for (const tx of sortTransactionsDesc(state.data.transactions)) {
                const norm = String(tx.title || '').trim().toLowerCase();
                if (norm && norm.includes(q) && !seen.has(norm)) {
                    seen.add(norm);
                    hits.push(tx);
                }
                if (hits.length >= 6) break;
            }

            if (hits.length === 0) {
                popup.classList.add('hidden');
                return;
            }

            popup.innerHTML = hits.map(m => {
                const cat = getCategory(m.categoryId);
                const acc = getAccount(m.accountId);
                const isInc = m.type === 'income';
                return `
                    <button type="button" class="autofill-item" data-action="apply-autofill" data-tx-id="${escHtml(m.id)}">
                        <div style="min-width:0;flex:1;">
                            <div style="font-size:13.5px;font-weight:700;color:var(--text-primary);word-break:break-word;">${escHtml(m.title)}</div>
                            <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">
                                <span style="font-weight:700;color:${cat.color};">${escHtml(cat.name)}</span> • ${escHtml(acc.name)}
                            </div>
                        </div>
                        <span class="tabular-nums ${isInc ? 'text-income' : 'text-expense'}" style="font-size:13px;font-weight:800;flex-shrink:0;">
                            ${isInc ? '+' : '-'}${formatINR(m.amount)}
                        </span>
                    </button>
                `;
            }).join('');
            popup.classList.remove('hidden');
        }
