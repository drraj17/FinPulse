        function triggerDownload(filename, content, mime) {
            try {
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (e) {
                showToast('Download blocked by browser sandbox', true);
            }
        }

        function exportCSV() {
            const rows = state.activeTab === 'history' ? getFilteredTransactions() : sortTransactionsDesc(state.data.transactions);
            const header = ['Date', 'Title', 'Type', 'Amount (INR)', 'Category', 'Account', 'Note'];
            const lines = rows.map(tx => {
                const cat = getCategory(tx.categoryId);
                const acc = getAccount(tx.accountId);
                return [
                    tx.date || '',
                    `"${String(tx.title || '').replace(/"/g, '""')}"`,
                    tx.type || '',
                    Number(tx.amount) || 0,
                    `"${String(cat.name).replace(/"/g, '""')}"`,
                    `"${String(acc.name).replace(/"/g, '""')}"`,
                    `"${String(tx.note || '').replace(/"/g, '""')}"`
                ].join(',');
            });
            triggerDownload(`finpulse-transactions-${new Date().toISOString().slice(0, 10)}.csv`, [header.join(','), ...lines].join('\n'), 'text/csv;charset=utf-8;');
            showToast(`Exported ${rows.length} entries to CSV`);
        }

        function exportJSON() {
            const payload = {
                app: 'FinPulse',
                version: 15,
                exportedAt: new Date().toISOString(),
                data: state.data
            };
            triggerDownload(`finpulse-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(payload, null, 2), 'application/json');
            showToast('Full JSON backup exported');
        }

        function importJSONFile(file) {
            if (!file) return;
            const mode = state.importMode || 'replace';
            const reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    const incoming = parsed && parsed.data ? parsed.data : parsed;
                    if (!incoming || !Array.isArray(incoming.categories) || !Array.isArray(incoming.accounts) || !Array.isArray(incoming.transactions)) {
                        showToast('Invalid FinPulse backup JSON', true);
                        return;
                    }
                    if (mode === 'replace') {
                        state.data = {
                            categories: incoming.categories,
                            accounts: incoming.accounts,
                            transactions: incoming.transactions
                        };
                    } else {
                        const cMap = new Map(state.data.categories.map(c => [c.id, c]));
                        incoming.categories.forEach(c => cMap.set(c.id, c));
                        const aMap = new Map(state.data.accounts.map(a => [a.id, a]));
                        incoming.accounts.forEach(a => aMap.set(a.id, a));
                        const tMap = new Map(state.data.transactions.map(t => [t.id, t]));
                        incoming.transactions.forEach(t => tMap.set(t.id, t));
                        state.data = {
                            categories: Array.from(cMap.values()),
                            accounts: Array.from(aMap.values()),
                            transactions: Array.from(tMap.values())
                        };
                    }
                    saveState();
                    renderSettings();
                    renderApp();
                    showToast(`Backup ${mode === 'replace' ? 'restored' : 'merged'}!`);
                } catch (err) {
                    showToast('Could not parse JSON file', true);
                }
            };
            reader.readAsText(file);
        }

        function updateGistStatus(msg, isError) {
            const el = $('gist-status');
            if (!el) return;
            el.textContent = msg;
            el.style.background = isError ? 'var(--expense-soft)' : 'var(--income-soft)';
            el.style.color = isError ? 'var(--expense)' : 'var(--income)';
            el.style.border = `1px solid ${isError ? 'rgba(244,63,94,0.35)' : 'rgba(16,185,129,0.35)'}`;
            el.classList.remove('hidden');
        }

        function getSavedGistCreds() {
            try { return JSON.parse(safeGet(GIST_KEY, '{}')) || { token: '', gistId: '' }; }
            catch (e) { return { token: '', gistId: '' }; }
        }

        function setCloudRemoteStatus(available, remoteUpdatedAt, remoteSignature) {
            const meta = readSyncMeta();
            meta.remoteAvailable = !!available;
            meta.remoteUpdatedAt = remoteUpdatedAt || '';
            if (remoteSignature) meta.lastRemoteSignature = remoteSignature;
            writeSyncMeta(meta);
            const pill = $('cloud-sync-state');
            if (pill) {
                const dirty = isDataDirty();
                pill.className = `cloud-state-pill ${available ? 'remote' : (dirty ? 'dirty' : '')}`;
                pill.textContent = available ? 'NEW BACKUP AVAILABLE' : (dirty ? 'BACKUP NEEDED' : 'UP TO DATE');
                const desc = pill.parentElement && pill.parentElement.querySelector('.cloud-status-description');
                if (desc) desc.textContent = available
                    ? 'Another device has a newer backup. Restore it to download the latest categories, accounts and transactions.'
                    : (dirty ? 'Your latest edits are saved on this device, but have not been uploaded to the cloud yet.' : 'This device matches the latest backup we know about.');
            }
        }

        async function checkForRemoteBackup(silent) {
            const creds = getSavedGistCreds();
            if (!creds.gistId) {
                if (!silent) updateGistStatus('Enter a Gist ID and save credentials to check for updates.', true);
                return false;
            }
            try {
                const headers = { 'Accept': 'application/vnd.github+json' };
                if (creds.token) headers['Authorization'] = `Bearer ${creds.token}`;
                const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(creds.gistId)}`, { headers });
                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    throw new Error(errBody.message || `HTTP ${res.status}`);
                }
                const gist = await res.json();
                const file = gist.files && (gist.files['finpulse-backup.json'] || Object.values(gist.files)[0]);
                if (!file || !file.content) throw new Error('FinPulse backup JSON was not found in this Gist.');
                const parsed = JSON.parse(file.content);
                const incoming = parsed && parsed.data ? parsed.data : parsed;
                if (!incoming || !Array.isArray(incoming.categories) || !Array.isArray(incoming.accounts) || !Array.isArray(incoming.transactions)) {
                    throw new Error('The cloud backup format is not valid.');
                }
                const remoteSignature = fingerprintData({ categories: incoming.categories, accounts: incoming.accounts, transactions: incoming.transactions });
                const localSignature = fingerprintData(state.data);
                const remoteUpdatedAt = gist.updated_at || parsed.backedUpAt || '';
                const meta = readSyncMeta();
                const isNewer = remoteSignature !== localSignature && (
                    !meta.lastRemoteUpdatedAt || !remoteUpdatedAt ||
                    new Date(remoteUpdatedAt).getTime() > new Date(meta.lastRemoteUpdatedAt).getTime()
                );
                const stillSameReminder = !!meta.remoteAvailable && meta.lastRemoteSignature === remoteSignature && remoteSignature !== localSignature;
                setCloudRemoteStatus(isNewer || stillSameReminder, remoteUpdatedAt, remoteSignature);
                if (!isNewer && remoteSignature === localSignature) {
                    const updated = readSyncMeta();
                    updated.lastRemoteUpdatedAt = remoteUpdatedAt;
                    updated.lastBackupSignature = localSignature;
                    updated.lastSyncedAt = updated.lastSyncedAt || new Date().toISOString();
                    updated.remoteAvailable = false;
                    writeSyncMeta(updated);
                }
                if (isNewer) showToast('A newer cloud backup is available. Tap the cloud icon to download it.');
                if (!silent) updateGistStatus(isNewer ? 'A newer backup is available. Tap Restore from Cloud to download it.' : 'No newer cloud backup found.', false);
                return isNewer;
            } catch (err) {
                if (!silent) updateGistStatus(`Cloud check failed: ${err.message}`, true);
                return false;
            }
        }

        function markCloudBackupComplete(remoteUpdatedAt) {
            const signature = fingerprintData(state.data);
            const meta = readSyncMeta();
            meta.lastBackupSignature = signature;
            meta.lastRemoteSignature = signature;
            meta.lastRemoteUpdatedAt = remoteUpdatedAt || new Date().toISOString();
            meta.lastSyncedAt = new Date().toISOString();
            meta.remoteAvailable = false;
            meta.remoteUpdatedAt = '';
            writeSyncMeta(meta);
        }

        function saveGistCreds() {
            const tEl = $('gist-token');
            const gEl = $('gist-id');
            const token = (tEl ? tEl.value : '').trim();
            const gistId = (gEl ? gEl.value : '').trim();
            safeSet(GIST_KEY, JSON.stringify({ token, gistId }));
            updateGistStatus('Credentials saved locally on this device.', false);
            showToast('GitHub Gist credentials saved');
            if (gistId) checkForRemoteBackup(true);
        }

        async function backupToGist() {
            const tEl = $('gist-token');
            const gEl = $('gist-id');
            const token = (tEl ? tEl.value : '').trim();
            let gistId = (gEl ? gEl.value : '').trim();
            if (!token) {
                updateGistStatus('Please enter a GitHub Personal Access Token.', true);
                return;
            }
            updateGistStatus('Backing up to GitHub Gist...', false);
            try {
                const url = gistId ? `https://api.github.com/gists/${encodeURIComponent(gistId)}` : 'https://api.github.com/gists';
                const res = await fetch(url, {
                    method: gistId ? 'PATCH' : 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        description: 'FinPulse Personal Expense Tracker Backup',
                        public: false,
                        files: {
                            'finpulse-backup.json': {
                                content: JSON.stringify({
                                    app: 'FinPulse',
                                    version: 15,
                                    backedUpAt: new Date().toISOString(),
                                    data: state.data
                                }, null, 2)
                            }
                        }
                    })
                });
                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    throw new Error(errBody.message || `HTTP ${res.status}`);
                }
                const data = await res.json();
                if (data.id) {
                    gistId = data.id;
                    if (gEl) gEl.value = gistId;
                }
                safeSet(GIST_KEY, JSON.stringify({ token, gistId }));
                markCloudBackupComplete(data.updated_at || new Date().toISOString());
                renderSettings();
                updateGistStatus(`Backed up to Gist (${gistId}) at ${new Date().toLocaleTimeString()}`, false);
                showToast('Backed up to GitHub Gist');
            } catch (err) {
                updateGistStatus(`Backup failed: ${err.message}`, true);
                showToast('Gist backup failed', true);
            }
        }

        async function restoreFromGist() {
            const tEl = $('gist-token');
            const gEl = $('gist-id');
            const token = (tEl ? tEl.value : '').trim();
            const gistId = (gEl ? gEl.value : '').trim();
            if (!gistId) {
                updateGistStatus('Please enter a Gist ID to restore from.', true);
                return;
            }
            updateGistStatus('Restoring from GitHub Gist...', false);
            try {
                const headers = { 'Accept': 'application/vnd.github+json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;
                const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, { headers });
                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    throw new Error(errBody.message || `HTTP ${res.status}`);
                }
                const data = await res.json();
                const file = data.files && (data.files['finpulse-backup.json'] || Object.values(data.files)[0]);
                if (!file || !file.content) throw new Error('Backup JSON file not found in Gist.');
                const parsed = JSON.parse(file.content);
                const incoming = parsed && parsed.data ? parsed.data : parsed;
                if (!incoming || !Array.isArray(incoming.categories) || !Array.isArray(incoming.accounts) || !Array.isArray(incoming.transactions)) {
                    throw new Error('Invalid FinPulse backup format.');
                }
                state.data = {
                    categories: incoming.categories,
                    accounts: incoming.accounts,
                    transactions: incoming.transactions
                };
                saveState({ synced: true, remoteUpdatedAt: data.updated_at || parsed.backedUpAt || new Date().toISOString() });
                safeSet(GIST_KEY, JSON.stringify({ token, gistId }));
                renderApp();
                renderSettings();
                updateGistStatus(`Restored ${incoming.transactions.length} transactions from Gist!`, false);
                showToast('Restored from GitHub Gist');
            } catch (err) {
                updateGistStatus(`Restore failed: ${err.message}`, true);
                showToast('Gist restore failed', true);
            }
        }

        // ---------------------------------------------------------------------

        function applyTheme(mode) {
            const root = document.documentElement;
            if (mode === 'light') {
                root.classList.add('light');

                root.classList.add('dark');
                root.classList.remove('light');

        function initTheme() {
            const saved = safeGet(THEME_KEY, null);
            applyTheme(saved === 'light' ? 'light' : 'dark');
        }

        // ---------------------------------------------------------------------
        // 18. SINGLE SVG-SAFE DELEGATED EVENT LISTENERS ON DOCUMENT
        // ---------------------------------------------------------------------
        function resolveActionEl(target) {
            if (!target) return null;
            const node = target.nodeType === 1 ? target : target.parentElement;
            if (!node || typeof node.closest !== 'function') return null;
            return node.closest('[data-action]');
        }

        function attachEventListeners() {
            document.addEventListener('click', (e) => {
                const rawEl = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement);

                // Modal backdrop click closes modal
                const bd = rawEl && rawEl.getAttribute && rawEl.getAttribute('data-backdrop');
                if (bd === 'modal-tx') {
                    closeTxModal();
                    return;
                }
                if (bd === 'modal-settings') {
                    const sm = $('modal-settings');
                    if (sm) sm.classList.add('hidden');
                    return;
                }

                const actionEl = resolveActionEl(e.target);
                if (!actionEl) {
                    const popup = $('tx-autofill-popup');
                    const titleInput = $('tx-title');
                    if (popup && !popup.classList.contains('hidden') && rawEl !== titleInput && !popup.contains(rawEl)) {
                        popup.classList.add('hidden');
                    }
                    return;
                }

                const action = actionEl.getAttribute('data-action');

                switch (action) {
                    case 'toggle-theme': {
                        const isLight = document.documentElement.classList.contains('light');
                        applyTheme(isLight ? 'dark' : 'light');
                        break;
                    }
                    case 'switch-tab': {
                        const tab = actionEl.getAttribute('data-tab');
                        if (tab) {
                            state.activeTab = tab;
                            renderApp();
                        }
                        break;
                    }
                    case 'open-settings': {
                        state.editingCatId = null;
                        state.editingAccId = null;
                        state.showCatForm = false;
                        state.showAccForm = false;
                        renderSettings();
                        const sm = $('modal-settings');
                        if (sm) sm.classList.remove('hidden');
                        break;
                    }
                    case 'open-backup-settings': {
                        state.settingsTab = 'backup';
                        state.editingCatId = null;
                        state.editingAccId = null;
                        state.showCatForm = false;
                        state.showAccForm = false;
                        renderSettings();
                        const sm = $('modal-settings');
                        if (sm) sm.classList.remove('hidden');
                        checkForRemoteBackup(true);
                        break;
                    }
                    case 'close-settings': {
                        const sm = $('modal-settings');
                        if (sm) sm.classList.add('hidden');
                        break;
                    }
                    case 'switch-settings-tab': {
                        state.settingsTab = actionEl.getAttribute('data-stab') || 'categories';
                        state.editingCatId = null;
                        state.editingAccId = null;
                        state.showCatForm = false;
                        state.showAccForm = false;
                        renderSettings();
                        break;
                    }
                    case 'show-category-form': {
                        state.editingCatId = null;
                        state.showCatForm = true;
                        state.pickedCatColor = '#6366f1';
                        state.pickedCatIcon = 'shopping-bag';
                        renderSettings();
                        const input = $('scat-name'); if (input) input.focus();
                        break;
                    }
                    case 'hide-category-form': {
                        state.editingCatId = null;
                        state.showCatForm = false;
                        renderSettings();
                        break;
                    }
                    case 'show-account-form': {
                        state.editingAccId = null;
                        state.showAccForm = true;
                        state.pickedAccColor = '#3b82f6';
                        state.pickedAccIcon = 'landmark';
                        renderSettings();
                        const input = $('sacc-name'); if (input) input.focus();
                        break;
                    }
                    case 'hide-account-form': {
                        state.editingAccId = null;
                        state.showAccForm = false;
                        renderSettings();
                        break;
                    }
                    case 'open-add-tx': {
                        openTxModal(null);
                        break;
                    }
                    case 'close-tx-modal': {
                        closeTxModal();
                        break;
                    }
                    case 'set-tx-type': {
                        const t = actionEl.getAttribute('data-type') || 'expense';
                        syncTxTypeButtons(t);
                        const accEl = $('tx-account');
                        const curAcc = accEl ? accEl.value : '';
                        const defCat = state.data.categories.find(c => c.type === t);
                        populateTxDropdowns(t, defCat ? defCat.id : '', curAcc);
                        break;
                    }
                    case 'apply-autofill': {
                        e.stopPropagation();
                        applyAutofill(actionEl.getAttribute('data-tx-id'));
                        break;
                    }
                    case 'edit-tx': {
                        e.stopPropagation();
                        openTxModal(actionEl.getAttribute('data-tx-id'));
                        break;
                    }
                    case 'delete-tx': {
                        e.stopPropagation();
                        const txId = actionEl.getAttribute('data-tx-id');
                        const tx = state.data.transactions.find(t => t.id === txId);
                        openConfirm(
                            'Delete Transaction',
                            `Delete "${tx ? tx.title : 'this entry'}"?`,
                            'Delete',
                            () => {
                                state.data.transactions = state.data.transactions.filter(t => t.id !== txId);
                                saveState();
                                renderApp();
                                showToast('Transaction deleted');
                            }
                        );
                        break;
                    }
                    case 'toggle-kpi': {
                        const k = actionEl.getAttribute('data-kpi');
                        state.expandedOverviewKpi = state.expandedOverviewKpi === k ? null : k;
                        renderApp();
                        break;
                    }
                    case 'close-kpi-drawer': {
                        state.expandedOverviewKpi = null;
                        renderApp();
                        break;
                    }
                    case 'toggle-overview-cat': {
                        const cId = actionEl.getAttribute('data-cat-id');
                        state.expandedOverviewCatId = state.expandedOverviewCatId === cId ? null : cId;
                        renderApp();
                        break;
                    }
                    case 'set-trend-granularity': {
                        state.trendGranularity = actionEl.getAttribute('data-val') || 'day';
                        renderApp();
                        break;
                    }
                    case 'set-trend-style': {
                        state.trendStyle = actionEl.getAttribute('data-val') || 'area';
                        renderApp();
                        break;
                    }
                    case 'toggle-trend-series': {
                        const s = actionEl.getAttribute('data-series');
                        if (s === 'income') state.showTrendIncome = !state.showTrendIncome;
                        if (s === 'expense') state.showTrendExpense = !state.showTrendExpense;
                        renderApp();
                        break;
                    }
                    case 'toggle-filters': {
                        state.filtersOpen = !state.filtersOpen;
                        renderApp();
                        break;
                    }
                    case 'reset-filters': {
                        state.filters = {
                            search: '',
                            year: 'all',
                            month: 'all',
                            type: 'all',
                            categoryId: 'all',
                            accountId: 'all'
                        };
                        renderApp();
                        showToast('Filters reset');
                        break;
                    }
                    case 'set-history-view': {
                        state.historyView = actionEl.getAttribute('data-view') || 'transactions';
                        renderApp();
                        break;
                    }
                    case 'toggle-history-cat': {
                        const cId = actionEl.getAttribute('data-cat-id');
                        state.expandedHistoryCats[cId] = !state.expandedHistoryCats[cId];
                        renderApp();
                        break;
                    }
                    case 'edit-budget': {
                        state.editingBudgetId = actionEl.getAttribute('data-cat-id');
                        renderApp();
                        break;
                    }
                    case 'cancel-budget-edit': {
                        state.editingBudgetId = null;
                        renderApp();
                        break;
                    }
                    case 'toggle-account': {
                        const aId = actionEl.getAttribute('data-acc-id');
                        state.expandedAccountId = state.expandedAccountId === aId ? null : aId;
                        renderApp();
                        break;
                    }
                    case 'edit-acc-shortcut': {
                        e.stopPropagation();
                        const acc = getAccount(actionEl.getAttribute('data-acc-id'));
                        state.settingsTab = 'accounts';
                        state.editingAccId = acc.id;
                        state.showAccForm = true;
                        state.pickedAccIcon = acc.icon || 'landmark';
                        state.pickedAccColor = acc.color || '#3b82f6';
                        renderSettings();
                        const sm = $('modal-settings');
                        if (sm) sm.classList.remove('hidden');
                        break;
                    }
                    case 'delete-account': {
                        e.stopPropagation();
                        const aId = actionEl.getAttribute('data-acc-id');
                        if (state.data.accounts.length <= 1) {
                            showToast('At least one account is required', true);
                            return;
                        }
                        const acc = getAccount(aId);
                        openConfirm(
                            'Delete Account',
                            `Delete account "${acc.name}" and permanently remove ${state.data.transactions.filter(t => t.accountId === aId).length} related transaction(s)?`,
                            'Delete',
                            () => {
                                const removedTransactions = deleteAccountWithTransactions(aId);
                                if (state.editingAccId === aId) state.editingAccId = null;
                                saveState();
                                renderSettings();
                                renderApp();
                                showToast(`Account deleted with ${removedTransactions} related transaction(s)`);
                            }
                        );
                        break;
                    }
                    case 'pick-cat-color': {
                        const nameEl = $('scat-name');
                        const typeEl = $('scat-type');
                        const draft = {
                            name: nameEl ? nameEl.value : undefined,
                            type: typeEl ? typeEl.value : undefined
                        };
                        state.pickedCatColor = actionEl.getAttribute('data-color') || '#6366f1';
                        renderSettings(draft);
                        break;
                    }
                    case 'pick-cat-icon': {
                        const nameEl = $('scat-name');
                        const typeEl = $('scat-type');
                        const draft = {
                            name: nameEl ? nameEl.value : undefined,
                            type: typeEl ? typeEl.value : undefined
                        };
                        state.pickedCatIcon = actionEl.getAttribute('data-icon') || 'tag';
                        renderSettings(draft);
                        break;
                    }
                    case 'edit-settings-cat': {
                        const cat = getCategory(actionEl.getAttribute('data-cat-id'));
                        state.editingCatId = cat.id;
                        state.showCatForm = true;
                        state.pickedCatIcon = cat.icon || 'tag';
                        state.pickedCatColor = cat.color || '#6366f1';
                        renderSettings();
                        break;
                    }
                    case 'cancel-edit-cat': {
                        state.editingCatId = null;
                        state.showCatForm = false;
                        renderSettings();
                        break;
                    }
                    case 'delete-settings-cat': {
                        const cId = actionEl.getAttribute('data-cat-id');
                        if (state.data.categories.length <= 1) {
                            showToast('At least one category is required', true);
                            return;
                        }
                        const cat = getCategory(cId);
                        openConfirm(
                            'Delete Category',
                            `Delete category "${cat.name}" and permanently remove ${state.data.transactions.filter(t => t.categoryId === cId).length} related transaction(s)?`,
                            'Delete',
                            () => {
                                const removedTransactions = deleteCategoryWithTransactions(cId);
                                saveState();
                                renderSettings();
                                renderApp();
                                showToast(`Category deleted with ${removedTransactions} related transaction(s)`);
                            }
                        );
                        break;
                    }
                    case 'pick-acc-color': {
                        const nameEl = $('sacc-name');
                        const typeEl = $('sacc-type');
                        const balEl = $('sacc-bal');
                        const draft = {
                            name: nameEl ? nameEl.value : undefined,
                            type: typeEl ? typeEl.value : undefined,
                            bal: balEl ? balEl.value : undefined
                        };
                        state.pickedAccColor = actionEl.getAttribute('data-color') || '#3b82f6';
                        renderSettings(draft);
                        break;
                    }
                    case 'pick-acc-icon': {
                        const nameEl = $('sacc-name');
                        const typeEl = $('sacc-type');
                        const balEl = $('sacc-bal');
                        const draft = {
                            name: nameEl ? nameEl.value : undefined,
                            type: typeEl ? typeEl.value : undefined,
                            bal: balEl ? balEl.value : undefined
                        };
                        state.pickedAccIcon = actionEl.getAttribute('data-icon') || 'landmark';
                        renderSettings(draft);
                        break;
                    }
                    case 'edit-settings-acc': {
                        const acc = getAccount(actionEl.getAttribute('data-acc-id'));
                        state.editingAccId = acc.id;
                        state.showAccForm = true;
                        state.pickedAccIcon = acc.icon || 'landmark';
                        state.pickedAccColor = acc.color || '#3b82f6';
                        renderSettings();
                        break;
                    }
                    case 'cancel-edit-acc': {
                        state.editingAccId = null;
                        state.showAccForm = false;
                        renderSettings();
                        break;
                    }
                    case 'toggle-gist-token': {
                        const tEl = $('gist-token');
                        const gEl = $('gist-id');
                        const tVal = tEl ? tEl.value : '';
                        const gVal = gEl ? gEl.value : '';
                        state.showGistToken = !state.showGistToken;
                        renderSettings();
                        const newT = $('gist-token');
                        const newG = $('gist-id');
                        if (newT) newT.value = tVal;
                        if (newG) newG.value = gVal;
                        break;
                    }
                    case 'export-csv': {
                        exportCSV();
                        break;
                    }
                    case 'export-json': {
                        exportJSON();
                        break;
                    }
                    case 'save-gist-creds': {
                        saveGistCreds();
                        break;
                    }
                    case 'check-cloud': {
                        const creds = getSavedGistCreds();
                        const tokenEl = $('gist-token'); const idEl = $('gist-id');
                        if (tokenEl && idEl) {
                            safeSet(GIST_KEY, JSON.stringify({ token: tokenEl.value.trim(), gistId: idEl.value.trim() }));
                        }
                        checkForRemoteBackup(false);
                        break;
                    }
                    case 'backup-gist': {
                        backupToGist();
                        break;
                    }
                    case 'restore-gist': {
                        restoreFromGist();
                        break;
                    }
                    case 'load-sample-data': {
                        openConfirm(
                            'Load Sample Data',
                            'Replace current data with default multi-year Indian Rupee (₹) sample accounts, categories, and transactions?',
                            'Load Sample Data',
                            () => {
                                state.data = createDefaultData();
                                saveState();
                                renderSettings();
                                renderApp();
                                showToast('Sample data loaded');
                            }
                        );
                        break;
                    }
                    case 'close-confirm': {
                        closeConfirm();
                        break;
                    }
                    case 'execute-confirm': {
                        const fn = state.confirmAction;
                        closeConfirm();
                        if (typeof fn === 'function') fn();
                        break;
                    }
                }
            });

            // Smart Title Auto-Fill Input Handler
            document.addEventListener('input', (e) => {
                if (e.target && e.target.id === 'tx-title') {
                    renderAutofillDropdown(e.target.value);
                }
            });

            // Delegated Submit Handlers
            document.addEventListener('submit', (e) => {
                if (!e.target) return;

                if (e.target.id === 'form-tx') {
                    e.preventDefault();
                    const idEl = $('tx-id');
                    const titleEl = $('tx-title');
                    const amtEl = $('tx-amount');
                    const dateEl = $('tx-date');
                    const catEl = $('tx-category');
                    const accEl = $('tx-account');
                    const noteEl = $('tx-note');
                    if (!titleEl || !amtEl || !dateEl || !catEl || !accEl) return;

                    const id = idEl ? idEl.value.trim() : '';
                    const title = titleEl.value.trim();
                    const amount = parseFloat(amtEl.value);
                    const date = dateEl.value;
                    const categoryId = catEl.value;
                    const accountId = accEl.value;
                    const note = noteEl ? noteEl.value.trim() : '';
                    const type = state.txType;

                    if (!title || isNaN(amount) || amount <= 0 || !date) {
                        showToast('Please enter a valid title, amount, and date', true);
                        return;
                    }

                    if (id) {
                        const idx = state.data.transactions.findIndex(t => t.id === id);
                        if (idx !== -1) {
                            state.data.transactions[idx] = { id, title, amount, type, categoryId, accountId, date, note };
                        }
                        showToast('Transaction updated');
                    } else {
                        state.data.transactions.unshift({
                            id: 'tx-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                            title,
                            amount,
                            type,
                            categoryId,
                            accountId,
                            date,
                            note
                        });
                        showToast('Transaction added');
                    }

                    saveState();
                    closeTxModal();
                    renderApp();
                    return;
                }

                const budgetCatId = e.target.getAttribute && e.target.getAttribute('data-budget-form');
                if (budgetCatId) {
                    e.preventDefault();
                    const inp = e.target.querySelector('input[name="limit"]');
                    const newLimit = Math.max(0, Number(inp ? inp.value : 0) || 0);
                    const cat = state.data.categories.find(c => c.id === budgetCatId);
                    if (cat) {
                        cat.limit = newLimit;
                        saveState();
                        showToast(`Updated ${cat.name} limit to ${formatINR(newLimit)}`);
                    }
                    state.editingBudgetId = null;
                    renderApp();
                    return;
                }

                if (e.target.id === 'form-settings-cat') {
                    e.preventDefault();
                    const nameEl = $('scat-name');
                    const typeEl = $('scat-type');
                    const name = (nameEl ? nameEl.value : '').trim();
                    const type = typeEl ? typeEl.value : 'expense';
                    if (!name) return;

                    if (state.editingCatId) {
                        const cat = state.data.categories.find(c => c.id === state.editingCatId);
                        if (cat) {
                            cat.name = name;
                            cat.type = type;
                            cat.icon = state.pickedCatIcon;
                            cat.color = state.pickedCatColor;
                        }
                        state.editingCatId = null;
                        state.showCatForm = false;
                        showToast('Category updated');
                    } else {
                        state.data.categories.push({
                            id: 'cat-' + Date.now(),
                            name,
                            type,
                            limit: 0,
                            icon: state.pickedCatIcon,
                            color: state.pickedCatColor
                        });
                        state.showCatForm = false;
                        showToast('Category added');
                    }

                    saveState();
                    renderSettings();
                    renderApp();
                    return;
                }

                if (e.target.id === 'form-settings-acc') {
                    e.preventDefault();
                    const nameEl = $('sacc-name');
                    const typeEl = $('sacc-type');
                    const balEl = $('sacc-bal');
                    const name = (nameEl ? nameEl.value : '').trim();
                    const type = typeEl ? typeEl.value : 'Bank';
                    const openingBalance = Number(balEl ? balEl.value : 0) || 0;
                    if (!name) return;

                    if (state.editingAccId) {
                        const acc = state.data.accounts.find(a => a.id === state.editingAccId);
                        if (acc) {
                            acc.name = name;
                            acc.type = type;
                            acc.openingBalance = openingBalance;
                            acc.icon = state.pickedAccIcon;
                            acc.color = state.pickedAccColor;
                        }
                        state.editingAccId = null;
                        state.showAccForm = false;
                        showToast('Account updated');
                    } else {
                        state.data.accounts.push({
                            id: 'acc-' + Date.now(),
                            name,
                            type,
                            openingBalance,
                            icon: state.pickedAccIcon,
                            color: state.pickedAccColor
                        });
                        state.showAccForm = false;
                        showToast('Account added');
                    }

                    saveState();
                    renderSettings();
                    renderApp();
                }
            });

            // Radio Import Mode & JSON File Import Handler
            document.addEventListener('change', (e) => {
                if (!e.target) return;
                if (e.target.name === 'import-mode') {
                    state.importMode = e.target.value || 'replace';
                    return;
                }
                if (e.target.id === 'input-import-json') {
                    const file = e.target.files && e.target.files[0];
                    if (file) {
                        importJSONFile(file);
                        e.target.value = '';
                    }
                }
            });

            // Escape Key Closes Open Modals
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeTxModal();
                    closeConfirm();
                    const sm = $('modal-settings');
                    if (sm) sm.classList.add('hidden');
                }
            });

            // Debounced Resize for Cash Flow Trend SVG
            let resizeTimer = null;
            window.addEventListener('resize', () => {
                if (state.activeTab !== 'overview') return;
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    renderTrendChartSVG();
                }, 90);
            });
        }

        // ---------------------------------------------------------------------
        // 19. SAFE INITIALIZATION (DOMContentLoaded OR IMMEDIATE)
        // ---------------------------------------------------------------------
        let initialized = false;
        function init() {
            if (initialized) return;
            initialized = true;
            try {
                initTheme();
                loadState();
                attachEventListeners();
                renderApp();
                refreshCloudButton();
                const syncCreds = getSavedGistCreds();
                if (syncCreds.gistId) checkForRemoteBackup(true);
            } catch (err) {
                state.data = createDefaultData();
                renderApp();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>

    <script>
    (function () {
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
            window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
        }
    })();
    </script>

</body>
</html>
