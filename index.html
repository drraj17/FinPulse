<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="FinPulse">
    <meta name="apple-mobile-web-app-title" content="FinPulse">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="64x64" href="icons/finpulse-64.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/finpulse-192.png">
    <link rel="apple-touch-icon" href="icons/finpulse-180.png">
    <title>FinPulse — Personal Expense & Budget Tracker</title>
    <style>
        /* =====================================================================
           1. DESIGN TOKENS & THEME SYSTEM (DARK-FIRST + CRISP LIGHT MODE)
           ===================================================================== */
        :root {
            --bg-canvas: #0b1120;
            --surface-main: #111827;
            --surface-card: #182234;
            --surface-elevated: #1e293b;
            --surface-pill: rgba(148, 163, 184, 0.12);
            --bg-input: #0f172a;
            --bg-header: rgba(11, 17, 32, 0.90);

            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;

            --border: #243044;
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-strong: #334155;

            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-soft: rgba(99, 102, 241, 0.18);

            --income: #34d399;
            --income-solid: #10b981;
            --income-soft: rgba(16, 185, 129, 0.16);

            --expense: #fb7185;
            --expense-solid: #ef4444;
            --expense-soft: rgba(244, 63, 94, 0.16);

            --cyan: #22d3ee;
            --cyan-soft: rgba(34, 211, 238, 0.16);

            --amber: #fbbf24;
            --amber-solid: #f59e0b;
            --amber-soft: rgba(245, 158, 11, 0.18);

            --glass-bg: rgba(15, 23, 42, 0.96);
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.24);
            --shadow-md: 0 12px 28px -6px rgba(0, 0, 0, 0.45);
            --shadow-xl: 0 24px 52px -12px rgba(0, 0, 0, 0.72);
        }

        html.light {
            --bg-canvas: #f8fafc;
            --surface-main: #ffffff;
            --surface-card: #ffffff;
            --surface-elevated: #f1f5f9;
            --surface-pill: #f1f5f9;
            --bg-input: #f8fafc;
            --bg-header: rgba(255, 255, 255, 0.92);

            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;

            --border: #e2e8f0;
            --border-subtle: #edf2f7;
            --border-strong: #cbd5e1;

            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: rgba(79, 70, 229, 0.11);

            --income: #059669;
            --income-solid: #10b981;
            --income-soft: rgba(16, 185, 129, 0.12);

            --expense: #e11d48;
            --expense-solid: #ef4444;
            --expense-soft: rgba(225, 29, 72, 0.10);

            --cyan: #0891b2;
            --cyan-soft: rgba(8, 145, 178, 0.12);

            --amber: #d97706;
            --amber-solid: #f59e0b;
            --amber-soft: rgba(245, 158, 11, 0.14);

            --glass-bg: rgba(255, 255, 255, 0.96);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 26px -5px rgba(15, 23, 42, 0.08);
            --shadow-xl: 0 22px 48px -12px rgba(15, 23, 42, 0.22);
        }

        /* =====================================================================
           2. RESET, BASE TYPOGRAPHY & ZERO HORIZONTAL SCROLLING
           ===================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            line-height: 1.45;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, p { margin: 0; }
        button, input, select { font-family: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; padding: 0; }

        .hidden { display: none !important; }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        .text-income { color: var(--income); }
        .text-expense { color: var(--expense); }
        .text-accent { color: var(--accent); }
        .text-cyan { color: var(--cyan); }
        .text-amber { color: var(--amber); }

        .bg-emerald { background-color: var(--income-solid); }
        .bg-amber { background-color: var(--amber-solid); }
        .bg-rose { background-color: var(--expense-solid); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.32); border-radius: 999px; }

        /* =====================================================================
           3. STICKY TOP HEADER, 4-TAB BOTTOM NAV & FLOATING (+) BUTTON
           ===================================================================== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 30;
            width: 100%;
            background: var(--bg-header);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.38);
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1.22rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 35;
            height: 68px;
            background: var(--bg-header);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
        }

        .bottom-nav-inner {
            max-width: 640px;
            margin: 0 auto;
            height: 100%;
            padding: 6px 10px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border-radius: 13px;
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 600;
            min-width: 0;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: var(--surface-pill);
        }

        .nav-tab.active {
            color: var(--accent);
            background: var(--accent-soft);
            font-weight: 700;
        }

        .fab-add {
            position: fixed;
            bottom: 84px;
            right: 18px;
            z-index: 40;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 28px rgba(79, 70, 229, 0.48);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .fab-add:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 14px 32px rgba(79, 70, 229, 0.56);
        }

        .fab-add:active { transform: scale(0.95); }

        /* =====================================================================
           4. LAYOUT CONTAINERS & GRIDS
           ===================================================================== */
        .main-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 14px 118px;
            overflow-x: hidden;
        }

        @media (min-width: 640px) {
            .main-container { padding: 22px 20px 120px; }
        }

        .stack-lg { display: flex; flex-direction: column; gap: 20px; width: 100%; min-width: 0; }
        .stack-md { display: flex; flex-direction: column; gap: 14px; width: 100%; min-width: 0; }
        .stack-sm { display: flex; flex-direction: column; gap: 10px; width: 100%; min-width: 0; }

        .card {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            background: var(--surface-main);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
        }

        .card.active-card {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md);
        }

        /* Single-Column Stacked KPI Boards across ALL screen sizes */
        .kpi-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            min-width: 0;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
            width: 100%;
            align-items: start;
        }

        @media (min-width: 960px) {
            .charts-grid {
                grid-template-columns: minmax(0, 1.32fr) minmax(0, 1fr);
            }
        }

        .budget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: 14px;
            width: 100%;
        }

        .history-cat-grid,
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
            gap: 14px;
            width: 100%;
            align-items: start;
        }

        .is-expanded {
            grid-column: 1 / -1;
            width: 100%;
            box-sizing: border-box;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            width: 100%;
        }

        .form-grid-3 {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 560px) {
            .form-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 680px) {
            .form-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        /* =====================================================================
           5. SHARED FULL-VIEW TRANSACTION CARD & ZERO-CLIPPING CSS GRID LIST
           ===================================================================== */
        .tx-grid-list {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-auto-rows: max-content;
            align-content: start;
            gap: 12px;
            width: 100%;
            min-width: 0;
        }

        .tx-grid-list.scrollable {
            max-height: 460px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2px;
        }

        @media (min-width: 780px) {
            .tx-grid-list.history-columns {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .tx-full-card {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            padding: 14px;
            border-radius: 14px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .tx-full-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        .tx-full-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
        }

        .tx-full-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            min-width: 0;
            flex: 1 1 0%;
        }

        .tx-full-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tx-full-text {
            min-width: 0;
            flex: 1 1 0%;
        }

        .tx-full-title {
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-primary);
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .tx-full-note {
            font-size: 12.5px;
            line-height: 1.38;
            color: var(--text-muted);
            margin-top: 3px;
            word-break: break-word;
        }

        .tx-full-amount-wrap {
            flex-shrink: 0;
            text-align: right;
            padding-top: 1px;
        }

        .tx-full-amount {
            font-size: 15.5px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            line-height: 1.35;
        }

        .tx-full-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }

        .tx-full-pills {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--surface-pill);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            line-height: 1.35;
            white-space: nowrap;
        }

        .tx-full-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .card-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .card-action-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        .card-action-btn.del:hover {
            background: var(--expense-soft);
            border-color: var(--expense);
            color: var(--expense);
        }

        /* =====================================================================
           6. OVERVIEW STACKED KPI BOARDS & INLINE PER-BOARD EXPANSION
           ===================================================================== */
        .kpi-card {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .kpi-card:hover { border-color: var(--border-strong); }

        .kpi-card-header {
            width: 100%;
            padding: 16px 18px;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            gap: 11px;
            text-align: left;
            transition: background-color 0.15s ease;
        }

        .kpi-card-header:hover { background: var(--surface-pill); }

        .kpi-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            min-width: 0;
        }

        .kpi-left {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
            flex: 1 1 0%;
        }

        .kpi-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .kpi-text-col {
            min-width: 0;
            flex: 1 1 0%;
        }

        .kpi-label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kpi-sub-text {
            display: block;
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kpi-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .kpi-value {
            font-size: clamp(1.1rem, 3.8vw, 1.46rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            white-space: nowrap;
            text-align: right;
        }

        .kpi-budget-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .chevron-box {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--surface-pill);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s ease, background-color 0.15s ease, color 0.15s ease;
        }

        .chevron-box.rotated {
            transform: rotate(180deg);
            background: var(--accent-soft);
            color: var(--accent);
        }

        .progress-track {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            background: var(--surface-elevated);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .inline-expanded-body {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-canvas);
            border-radius: 0 0 17px 17px;
            animation: slideFade 0.16s ease-out;
        }

        .expanded-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .expanded-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
            flex: 1;
        }

        .expanded-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .savings-summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .savings-summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }

        .summary-stat-tile {
            padding: 12px 14px;
            border-radius: 13px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            min-width: 0;
        }

        .summary-stat-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .summary-stat-val {
            display: block;
            font-size: 15px;
            font-weight: 800;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .budget-progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .budget-mini-card {
            padding: 12px 14px;
            border-radius: 13px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        @keyframes slideFade {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================================
           7. CHARTS & NORMAL-FLOW SPENDING BY CATEGORY
           ===================================================================== */
        .chart-card { padding: 18px; }

        .chart-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }

        .chart-title { font-size: 1.04rem; font-weight: 800; color: var(--text-primary); }
        .chart-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

        .controls-cluster {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
        }

        .segmented-group {
            display: inline-flex;
            padding: 3px;
            border-radius: 11px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
        }

        .seg-btn {
            padding: 5px 11px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .seg-btn.active { background: var(--accent); color: #ffffff; }
        .seg-btn.active-surface { background: var(--surface-main); color: var(--text-primary); box-shadow: var(--shadow-sm); }

        .series-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 11px;
            font-size: 12px;

        .cat-breakdown-list {

            flex-direction: column;
            gap: 10px;
            width: 100%;

        .cat-breakdown-item {

            gap: 10px;

        /* =====================================================================
           8. HISTORY TOOLBAR, COLLAPSIBLE FILTERS & BUTTONS
           ===================================================================== */

            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .toolbar-group {

            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 38px;
            padding: 7px 14px;
            border-radius: 11px;
            font-size: 12.5px;
            font-weight: 700;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-primary { background: var(--accent); color: #ffffff; }

        .btn-secondary { background: var(--surface-card); border: 1px solid var(--border); color: var(--text-primary); }
        .btn-secondary:hover { border-color: var(--accent); }
        .btn-danger-soft { background: var(--expense-soft); border: 1px solid rgba(244, 63, 94, 0.36); color: var(--expense); }
        .btn-emerald { background: var(--income-solid); color: #ffffff; }
        .btn-danger { background: var(--expense-solid); color: #ffffff; }

        .filter-panel {
            padding: 16px;

            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            animation: slideFade 0.16s ease-out;

            .filter-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (min-width: 920px) {
            .filter-panel { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .input-control {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: 41px;
            padding: 8px 12px;
            border-radius: 11px;

            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 13.5px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .input-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .date-group-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            min-width: 0;
        }

        .date-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 2px 4px;
        }

        .date-group-label { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
        .date-group-net {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--surface-card);
            border: 1px solid var(--border);
        }

        .cat-card-header-btn {
            width: 100%;
            padding: 15px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
            min-width: 0;
            border-radius: 17px;
        }

        .cat-card-header-btn:hover { background: var(--surface-pill); }

        /* =====================================================================
           9. ACCOUNTS NET WORTH HERO
           ===================================================================== */
        .networth-hero {
            width: 100%;
            box-sizing: border-box;
            border-radius: 22px;
            padding: 24px;
            background: linear-gradient(135deg, #111827 0%, #1e1b4b 54%, #0f172a 100%);
            color: #ffffff;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(99, 102, 241, 0.34);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .hero-metrics { display: flex; flex-wrap: wrap; gap: 12px; }
        .hero-metric-box {
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        /* =====================================================================
           10. MODALS, AUTO-FILL, 28-ICON PICKER, RADIO GROUP & TOASTS
           ===================================================================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(2, 6, 23, 0.72);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
        }

        @media (min-width: 640px) {
            .modal-backdrop { align-items: center; padding: 18px; }
        }

        .modal-dialog {
            background: var(--surface-main);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            border-radius: 22px 22px 0 0;
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideFade 0.16s ease-out;
        }

        .modal-dialog.wide { max-width: 680px; max-height: 88vh; }

        @media (min-width: 640px) {
            .modal-dialog { border-radius: 22px; }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .modal-body {
            padding: 18px 20px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
        }

        .settings-tabs-bar {
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .stab-btn {
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .stab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .type-switch-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding: 5px;
            border-radius: 13px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
        }

        .type-switch-btn {
            min-height: 40px;
            border-radius: 9px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .type-switch-btn.active-exp { background: var(--expense-solid); color: #ffffff; }
        .type-switch-btn.active-inc { background: var(--income-solid); color: #ffffff; }

        .autofill-wrap { position: relative; }
        .autofill-popup {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 60;
            background: var(--surface-card);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            box-shadow: var(--shadow-xl);
            max-height: 240px;
            overflow-y: auto;
        }

        .autofill-item {
            width: 100%;
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }

        .autofill-item:last-child { border-bottom: none; }
        .autofill-item:hover { background: var(--accent-soft); }

        .settings-box {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }

        .swatch-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .swatch-btn { width: 32px; height: 32px; border-radius: 50%; transition: transform 0.15s ease; }
        .swatch-btn.selected {
            transform: scale(1.14);
            box-shadow: 0 0 0 2px var(--surface-card), 0 0 0 4px var(--text-primary);
        }

        .icon-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
            gap: 8px;
            max-height: 236px;
            overflow-y: auto;
            padding: 4px;
        }

        .icon-choice-btn {
            width: 100%;
            min-height: 46px;
            border-radius: 12px;
            background: var(--surface-main);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .icon-choice-btn:hover { border-color: var(--accent); }
        .icon-choice-btn.selected {
            border-color: transparent;
            color: #ffffff;
            transform: scale(1.04);
            box-shadow: var(--shadow-sm);
        }

        .radio-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border-radius: 10px;
            background: var(--surface-main);
            border: 1px solid var(--border);
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .radio-pill input { accent-color: var(--accent); margin: 0; }

        .toast-stack {
            position: fixed;
            top: 72px;
            right: 16px;
            z-index: 70;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 340px;
            width: calc(100% - 32px);
            pointer-events: none;
        }

        .toast-item {
            pointer-events: auto;
            padding: 12px 15px;
            border-radius: 13px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.28);
            box-shadow: var(--shadow-md);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            animation: slideFade 0.16s ease-out;
        }

        .toast-item.error {
            background: #7f1d1d;
            border-color: rgba(248, 113, 113, 0.45);
        }

        /* =====================================================================
           SETTINGS REFRESH — compact actions, clean lists, scroll-safe forms
           ===================================================================== */
        .settings-modal-body { gap: 18px; }
        .settings-section-head {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding:2px 1px 4px; flex-wrap:wrap;
        }
        .settings-section-title { font-size:17px; font-weight:800; letter-spacing:-.02em; }
        .settings-section-subtitle { color:var(--text-muted); font-size:12.5px; margin-top:3px; }
        .settings-add-btn { min-height:40px; padding:8px 14px; }
        .settings-form-wrap {
            padding:16px; border:1px solid var(--accent); border-radius:17px;
            background:linear-gradient(145deg,var(--accent-soft),var(--surface-card) 48%);
            box-shadow:0 0 0 3px var(--accent-soft);
        }
        .settings-list { display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
        @media (min-width:620px) { .settings-list { grid-template-columns:repeat(2,minmax(0,1fr)); } }
        .settings-item {
            min-width:0; display:flex; align-items:center; gap:12px; padding:12px 13px;
            background:var(--surface-card); border:1px solid var(--border); border-radius:15px;
            transition:border-color .15s ease,transform .15s ease;
        }
        .settings-item:hover { border-color:var(--border-strong); transform:translateY(-1px); }
        .settings-item-icon {
            width:42px; height:42px; flex:0 0 42px; border-radius:13px;
            display:flex; align-items:center; justify-content:center;
        }
        .settings-item-info { min-width:0; flex:1; }
        .settings-item-name { font-size:13.5px; font-weight:750; overflow-wrap:anywhere; }
        .settings-item-detail { color:var(--text-muted); font-size:11.5px; margin-top:3px; }
        .settings-item-actions { display:flex; gap:5px; flex:0 0 auto; }
        .settings-empty {
            padding:22px 14px; text-align:center; color:var(--text-muted); font-size:13px;
            border:1px dashed var(--border-strong); border-radius:15px; background:var(--surface-card);
        }
        .settings-form-actions { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; padding-top:4px; }
        .settings-list-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .settings-list-count { color:var(--text-muted); font-size:11.5px; font-weight:650; }
        .cloud-status-card {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px;
            padding:16px; border:1px solid var(--border); border-radius:17px;
            background:linear-gradient(140deg,var(--surface-card),var(--surface-main));
        }
        .cloud-status-left { display:flex; align-items:flex-start; gap:12px; min-width:0; flex:1; }
        .cloud-status-icon {
            width:42px; height:42px; flex:0 0 42px; display:flex; align-items:center; justify-content:center;
            border-radius:13px; background:var(--accent-soft); color:var(--accent);
        }
        .cloud-status-title { font-size:14px; font-weight:800; }
        .cloud-status-description { color:var(--text-muted); font-size:12px; margin-top:3px; line-height:1.5; }
        .cloud-state-pill {
            display:inline-flex; align-items:center; gap:6px; margin-top:8px; padding:4px 9px;
            border-radius:999px; font-size:10.5px; font-weight:800;
            background:var(--income-soft); color:var(--income);
        }
        .cloud-state-pill.dirty,.cloud-state-pill.remote { background:var(--amber-soft); color:var(--amber); }
        .cloud-state-pill.remote { background:var(--expense-soft); color:var(--expense); }
        .icon-btn.sync-dirty { color:var(--amber); border-color:var(--amber); background:var(--amber-soft); }
        .icon-btn.sync-remote { color:var(--expense); border-color:var(--expense); background:var(--expense-soft); }
        .icon-btn.sync-clean { color:var(--income); border-color:rgba(16,185,129,.45); }
        .icon-btn.sync-dirty::after,.icon-btn.sync-remote::after {
            content:''; width:7px; height:7px; position:absolute; margin:-25px 0 0 25px;
            border-radius:50%; background:currentColor; box-shadow:0 0 0 2px var(--surface-card);
        }
        #btn-cloud-sync { position:relative; }
        .settings-hint {
            padding:11px 13px; border-radius:12px; background:var(--accent-soft);
            color:var(--text-secondary); font-size:12px; line-height:1.55;
        }
        @media (max-width:480px) {
            .settings-modal-body { padding:14px 13px; }
            .settings-form-wrap { padding:13px; }
            .settings-section-head { align-items:flex-start; }
            .settings-add-btn { width:100%; }
            .settings-item { padding:10px; }

            .cloud-status-card { align-items:stretch; }
            .cloud-status-left { width:100%; flex:1 1 auto; }
            .cloud-status-card .toolbar-group { width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
            .cloud-status-card .toolbar-group .btn { min-width:0; white-space:normal; padding-left:8px; padding-right:8px; }
        }

    </style>
</head>

        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

        <div class="bottom-nav-inner">

            <button type="button" id="nav-history" class="nav-tab" data-action="switch-tab" data-tab="history">

        function escHtml(str) {

                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatINR(num, showPlus) {
            const n = Number(num) || 0;
            const abs = Math.abs(Math.round(n));
            let formatted = '';
            try {
                formatted = abs.toLocaleString('en-IN');
            } catch (e) {
                formatted = String(abs);
            }
            if (n < 0) return `-₹${formatted}`;
            if (showPlus && n > 0) return `+₹${formatted}`;
            return `₹${formatted}`;
        }

        function formatAxisINR(v) {
            const n = Number(v) || 0;
            if (n === 0) return '₹0';
            if (n >= 10000000) return `₹${(n / 10000000).toFixed(1).replace(/\.0$/, '')}Cr`;
            if (n >= 100000) return `₹${(n / 100000).toFixed(1).replace(/\.0$/, '')}L`;
            if (n >= 1000) return `₹${(n / 1000).toFixed(1).replace(/\.0$/, '')}k`;
            return `₹${Math.round(n)}`;
        }

        function toISODate(year, monthIndex, day) {
            const dt = new Date(year, monthIndex, day);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatFullDate(iso) {
            if (!iso || iso.length < 10) return iso || '';
            const parts = iso.split('-');
            const y = Number(parts[0]);
            const m = Number(parts[1]) - 1;
            const d = Number(parts[2]);
            if (isNaN(y) || isNaN(m) || isNaN(d)) return iso;
            return `${String(d).padStart(2, '0')} ${MONTH_SHORT[m] || ''} ${y}`;
        }

            if (!iso || iso.length < 10) return iso || '';

        function loadState() {
            const raw = safeGet(STORAGE_KEY, null);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (
                        parsed &&
                        Array.isArray(parsed.categories) && parsed.categories.length > 0 &&
                        Array.isArray(parsed.accounts) && parsed.accounts.length > 0 &&
                        Array.isArray(parsed.transactions)
                    ) {
                        state.data = parsed;
                        return;
                    }
                } catch (e) {
                    // Fall back to fresh sample data
                }
            }
            state.data = createDefaultData();
            saveState();
        }

        function readSyncMeta() {
            try { return JSON.parse(safeGet(SYNC_META_KEY, '{}')) || {}; }
            catch (e) { return {}; }
        }

        function writeSyncMeta(meta) {
            safeSet(SYNC_META_KEY, JSON.stringify(meta || {}));
            refreshCloudButton();
        }

        function fingerprintData(data) {
            const str = JSON.stringify(data || {});
            let hash = 2166136261;
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(16);
        }

        function isDataDirty() {
            const meta = readSyncMeta();
            return !meta.lastBackupSignature || meta.lastBackupSignature !== fingerprintData(state.data);
        }

        function saveState(options) {
            try {
                safeSet(STORAGE_KEY, JSON.stringify(state.data));
                const meta = readSyncMeta();
                if (options && options.synced) {
                    const signature = fingerprintData(state.data);
                    meta.lastBackupSignature = signature;
                    meta.lastRemoteSignature = signature;
                    meta.lastSyncedAt = new Date().toISOString();
                    meta.lastRemoteUpdatedAt = options.remoteUpdatedAt || meta.lastRemoteUpdatedAt || '';
                    meta.remoteAvailable = false;
                    meta.remoteUpdatedAt = '';
                } else {
                    meta.lastLocalChangeAt = new Date().toISOString();
                }
                safeSet(SYNC_META_KEY, JSON.stringify(meta));
                refreshCloudButton();
            } catch (e) {
                // Keep the in-memory app usable if local storage is unavailable.
            }
        }

        function refreshCloudButton() {
            const btn = $('btn-cloud-sync');
            if (!btn || !state.data) return;
            const meta = readSyncMeta();
            const remote = !!meta.remoteAvailable;
            const dirty = isDataDirty();
            btn.classList.remove('sync-dirty', 'sync-remote', 'sync-clean');
            if (remote) {
                btn.classList.add('sync-remote');
                btn.title = 'A newer cloud backup is available — tap to restore';
                btn.setAttribute('aria-label', 'A newer cloud backup is available');
            } else if (dirty) {
                btn.classList.add('sync-dirty');
                btn.title = 'Changes need backup — tap to sync';
                btn.setAttribute('aria-label', 'Changes need cloud backup');
            } else {
                btn.classList.add('sync-clean');
                btn.title = 'Data backed up — tap for backup and restore';
                btn.setAttribute('aria-label', 'Cloud backup is up to date');
            }
        }

        function getCategory(id) {
            return state.data.categories.find(c => c.id === id) || {
                id: 'unknown',
                name: 'Uncategorized',
                type: 'expense',
                limit: 0,
                icon: 'tag',
                color: '#64748b'

        function getAccount(id) {
            return state.data.accounts.find(a => a.id === id) || {
                id: 'unknown',
                name: 'Unknown Account',
                type: 'Bank',
                openingBalance: 0,
                icon: 'wallet',
                color: '#64748b'
            };
        }

        // Referential-integrity helpers: deleting a parent also removes every
        // transaction that points to it, so balances and expense totals recalculate.
        function deleteAccountWithTransactions(accountId) {
            const before = state.data.transactions.length;
            state.data.transactions = state.data.transactions.filter(tx => tx.accountId !== accountId);
            state.data.accounts = state.data.accounts.filter(account => account.id !== accountId);
            if (state.expandedAccountId === accountId) state.expandedAccountId = null;
            if (state.filters && state.filters.accountId === accountId) state.filters.accountId = 'all';
            return before - state.data.transactions.length;
        }

        function deleteCategoryWithTransactions(categoryId) {
            const before = state.data.transactions.length;
            state.data.transactions = state.data.transactions.filter(tx => tx.categoryId !== categoryId);
            state.data.categories = state.data.categories.filter(category => category.id !== categoryId);
            if (state.editingCatId === categoryId) state.editingCatId = null;
            if (state.editingBudgetId === categoryId) state.editingBudgetId = null;
            if (state.expandedOverviewCatId === categoryId) state.expandedOverviewCatId = null;
            if (state.expandedHistoryCats) delete state.expandedHistoryCats[categoryId];
            if (state.filters && state.filters.categoryId === categoryId) state.filters.categoryId = 'all';
            return before - state.data.transactions.length;
        }

        function sortTransactionsDesc(list) {
            return list.slice().sort((a, b) => {
                const cmp = String(b.date || '').localeCompare(String(a.date || ''));
                if (cmp !== 0) return cmp;
                return String(b.id || '').localeCompare(String(a.id || ''));
            });
        }

        function getActiveMonthKey() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        }

        function getAccountBalance(accId) {
            const acc = getAccount(accId);
            let bal = Number(acc.openingBalance) || 0;
            for (const tx of state.data.transactions) {
                if (tx.accountId === accId) {
                    const amt = Number(tx.amount) || 0;
                    bal += tx.type === 'income' ? amt : -amt;
                }
            }
            return bal;
        }

        function countActiveFilters() {
            const f = state.filters;
            let count = 0;
            if (f.search.trim()) count++;
            if (f.year !== 'all') count++;
            if (f.month !== 'all') count++;
            if (f.type !== 'all') count++;
            if (f.categoryId !== 'all') count++;
            if (f.accountId !== 'all') count++;
            return count;
        }

        function getFilteredTransactions() {
            const f = state.filters;
            const q = f.search.trim().toLowerCase();
            return sortTransactionsDesc(state.data.transactions.filter(tx => {
                if (f.type !== 'all' && tx.type !== f.type) return false;
                if (f.categoryId !== 'all' && tx.categoryId !== f.categoryId) return false;
                if (f.accountId !== 'all' && tx.accountId !== f.accountId) return false;
                const d = tx.date || '';
                if (f.year !== 'all' && d.slice(0, 4) !== f.year) return false;
                if (f.month !== 'all' && d.slice(5, 7) !== f.month) return false;
                if (q) {
                    const cat = getCategory(tx.categoryId);
                    const acc = getAccount(tx.accountId);
                    const hay = `${tx.title || ''} ${tx.note || ''} ${cat.name} ${acc.name}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            }));
        }

        // ---------------------------------------------------------------------

        // ---------------------------------------------------------------------
        function showToast(message, isError) {
            const stack = $('toast-stack');
            if (!stack) return;
            const item = document.createElement('div');
            item.className = `toast-item${isError ? ' error' : ''}`;
            item.textContent = message;
            stack.appendChild(item);
            setTimeout(() => {
                item.style.opacity = '0';
                item.style.transition = 'opacity 0.2s ease';
                setTimeout(() => {
                    if (item.parentNode) item.parentNode.removeChild(item);
                }, 220);
            }, 2600);
        }

        function openConfirm(title, message, btnLabel, callback) {
            const modal = $('modal-confirm');
            if (!modal) return;
            const tEl = $('confirm-title');
            const mEl = $('confirm-msg');
            const bEl = $('btn-confirm-yes');
            if (tEl) tEl.textContent = title;
            if (mEl) mEl.textContent = message;
            if (bEl) bEl.textContent = btnLabel || 'Confirm';
            state.confirmAction = callback;
            modal.classList.remove('hidden');
        }

        function closeConfirm() {
            const modal = $('modal-confirm');
            if (modal) modal.classList.add('hidden');
            state.confirmAction = null;
        }
